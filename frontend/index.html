<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Yak Academy 安全实训学院：连接教程、靶场与竞赛，在实践中建立安全能力。" />
    <title>Yak Academy · 安全实训学院</title>
    <script>try{var p=localStorage.getItem('academy_theme');var d=p==='dark'||((p!=='light')&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);document.documentElement.style.colorScheme=d?'dark':'light'}catch(e){}</script>
    <style>html{background:#fff}html.dark{background:#050506}</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
