        awd_weight: { type: number }
        report_weight: { type: number }
    AwdFinalStandingView:
      type: object
      description: 最终排名条目（AWD 分归一化 × 权重 + 战报分 × 权重）
      properties:
        rank: { type: integer }
        competitor_type: { type: string, enum: [team, user] }
        competitor_id: { type: integer }
        competitor_name: { type: string }
        awd_score: { type: integer }
        report_score: { type: integer }
        final_score: { type: number, description: 保留两位小数 }
