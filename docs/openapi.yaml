  responses:
    ErrorResp:
      description: 统一错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [public]
      security: []
      summary: 健康检查（进程存活探针，无鉴权；compose healthcheck 使用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
  /metrics:
    get:
      tags: [public]
      security: []
      summary: >
        Prometheus 文本格式指标（ops 硬化）：HTTP 请求计数/耗时按路由 pattern 聚合
        （method/route/status 标签）+ 运行时指标（goroutine/内存/uptime）。
        Bearer 令牌与 ACADEMY_METRICS_TOKEN 恒时比对；未配置 token = 端点关闭 404。
        告警由外部 Prometheus + Alertmanager 完成（平台不内置）
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录换取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /auth/wechat/status:
    get:
      tags: [auth]
      security: []
      summary: 微信注册/登录可用性
      description: >
        返回当前部署是否已配置微信网页授权。enabled=false 时 /auth/wechat/start
        返回 501；mock=true 仅本地/E2E（ACADEMY_WECHAT_MOCK=1，严格模式禁止）。
        mock_admin=true 表示 Mock 模式已显式绑定既有 admin 账号，登录页可展示
        管理员模拟入口（ACADEMY_WECHAT_MOCK_ADMIN_USERNAME）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, mock, mock_admin, mode]
                properties:
                  enabled: { type: boolean }
                  mock: { type: boolean, description: 本地模拟微信回调（生产必须 false） }
                  mock_admin:
                    type: boolean
                    description: Mock 模式是否提供管理员模拟登录（显式绑定既有 admin 账号）
                  mode: { type: string, enum: ['', official_account, open_platform] }

  /auth/wechat/start:
    get:
      tags: [auth]
      security: []
      summary: 发起微信网页授权（唯一自助注册入口）
      description: >
        生成微信授权地址并返回给前端整页跳转。响应同时写入 HttpOnly +
        SameSite=Lax 的 state Cookie（签名会话，10 分钟有效），回调时由
        /auth/wechat/callback 校验，防登录 CSRF。公众号网页授权使用
        oauth2/authorize + snsapi_userinfo；开放平台网站应用使用 qrconnect +
        snsapi_login。redirect 只允许站内绝对路径，禁止外站 URL。
        as=admin 仅 ACADEMY_WECHAT_MOCK=1 且配置了
        ACADEMY_WECHAT_MOCK_ADMIN_USERNAME 时有效：回调登录该既有 admin 账号。
      parameters:
        - name: redirect
          in: query
          schema: { type: string }
          description: 登录成功后的站内路径（默认 /learn，必须以 / 开头且不能是 //）
        - name: mock_id
          in: query
          schema: { type: string, maxLength: 64 }
          description: 仅 ACADEMY_WECHAT_MOCK=1 时生效，本地/E2E 模拟稳定微信身份
        - name: as
          in: query
          schema: { type: string, enum: [admin] }
          description: 仅 Mock 模式有效；admin = 登录显式配置的既有管理员账号（开发/演示用）
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie:
              description: academy_wechat_state（HttpOnly；签名 state 会话）
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url: { type: string, description: 微信授权页或 Mock 回调地址 }
        '422': { $ref: '#/components/responses/ErrorResp' }
        '501': { $ref: '#/components/responses/ErrorResp' }

  /auth/wechat/callback:
    post:
      tags: [auth]
      security: []
      summary: 微信授权回调换登录 token（首次自动注册）
      description: >
        微信回调回到前端登录页后，前端把 code/state 提交到此接口。服务端校验
        state Cookie（nonce 恒时比对 + HMAC 签名 + 10 分钟过期）→ 调用微信
        access_token/userinfo → 按 openid（其次 unionid）查找账号，首次登录自动
        创建 student 账号（无密码，密码登录不可用）。Mock 模式以 as=admin 发起的
        state 会话会校验并登录 ACADEMY_WECHAT_MOCK_ADMIN_USERNAME 指定的既有
        admin 账号，不创建学员账号。成功返回应用 JWT，不把 token 放进 URL。
        state Cookie 一次性，成功后即清除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string, description: 微信 OAuth code（Mock 模式为 mock） }
                state: { type: string, description: 与 state Cookie 中的 nonce 一致 }
      responses:
        '200':
          description: OK（注册/登录成功）
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, redirect]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  redirect: { type: string, description: 登录后的站内路径 }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }
        '501': { $ref: '#/components/responses/ErrorResp' }

  /auth/password-reset/code:
    post:
      tags: [auth]
      security: []
      summary: 发送找回密码验证码（历史账号：邮箱/手机号）
      description: >
        仅服务邮箱/手机号历史账号找回密码；微信注册账号无密码，不走此接口。
        向已注册邮箱发送 6 位验证码（5 分钟有效，核销一次性）；未绑定邮箱的
        旧账号可填 phone 走短信通道（兼容保留）。
        邮箱/手机号未注册 → 422（发码即拒；竞赛批量/微信建号未绑定邮箱/手机号，
        此类账号请联系管理员重置）。email 与 phone 必须且只能填写一个。
        限频：同目标 60 秒内仅一次、10 分钟内最多 3 次（限频返回 200 + retry_after）。
        验证码用途隔离（purpose=password_reset）：历史 register 用途码不可用于重置。
        回显与投递安全约束同邮件投递配置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, maxLength: 254, description: 已注册邮箱（推荐） }
                phone: { type: string, pattern: '^1[3-9][0-9]{9}$', description: 旧账号绑定手机号（兼容） }
      responses:
        '200':
          description: OK（已发送；60 秒内重复请求返回此状态并带 retry_after 提示）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  retry_after: { type: integer, description: 限频剩余秒数，0 = 无需等待 }
                  code: { type: string, description: 验证码原文；仅本地演示回显模式返回 }
        '422': { $ref: '#/components/responses/ErrorResp' }
        '501': { $ref: '#/components/responses/ErrorResp' }

  /auth/password-reset:
    post:
      tags: [auth]
      security: []
      summary: 凭验证码重置密码（找回账号）
      description: >
        核销找回验证码并更新密码，该账号全部已签发 token 随即失效。
        成功响应返回用户名与账号编码——忘记用户名的学员凭邮箱（旧账号可凭手机号）
        即可找回账号。email 与 phone 必须且只能填写一个，验证码必须与填写渠道一致。
        验证码错误/过期/已核销或目标未注册 → 422。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, new_password]
              properties:
                email: { type: string, format: email, maxLength: 254, description: 已注册邮箱（推荐）；与 phone 二选一 }
                phone: { type: string, pattern: '^1[3-9][0-9]{9}$', description: 旧账号绑定手机号；与 email 二选一 }
                code: { type: string, minLength: 6, maxLength: 6 }
                new_password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK（密码已重置，返回账号标识供找回）
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  account_code: { type: string, description: "学号式账号编码 YA{YY}-{NNNNN}" }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出（吊销当前 token）
      description: 按 JWT 的 jti 写入撤销表，令牌在自然过期前立即失效。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /auth/change-password:
    post:
      tags: [auth]
      summary: 修改本人密码
      description: 校验当前密码后更新；同时使该用户全部已签发 token 失效（需重新登录）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /me:
    get:
      tags: [auth]
      summary: 当前用户信息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /me/profile:
    get:
      tags: [auth]
      summary: 账号信息面板（含内置账号 ID、名称、简介、总得分、头像）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/ErrorResp' }
    patch:
      tags: [auth]
      summary: 修改账号信息（描述简介）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: string, description: 描述简介（≤500 字） }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /me/capabilities:
    get:
      tags: [auth]
      summary: 当前用户能力画像（按可见题目分类统计通关覆盖）
      responses:
        '200':
          description: OK
          content:
            application/json:
