openapi: 3.0.3
info:
  title: yak-academy API
  version: 0.1.0
  description: |
    yak-academy 安全实训平台 API 契约（唯一契约源）。
    规则：改接口必须先改本文件，再改后端 handler，再改前端 src/api/。
    统一错误信封：{"error":{"code","message"}}。
    第一版所有接口允许 stub 返回 501，但路由必须注册。
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: auth
  - name: student
  - name: admin
  - name: env
  - name: public

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, CONFLICT, INTERNAL]
            message: { type: string }
    Page:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        global_role: { type: string, enum: [student, admin], description: student=普通人，admin=管理员 }
    Topic:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        room_count: { type: integer }
    Room:
      type: object
      properties:
        slug: { type: string }
        topic_slug: { type: string }
        title: { type: string }
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        lesson_md: { type: string, description: 教程正文 Markdown }
        video_url: { type: string, description: 视频教程地址（可选，lesson.md front matter video 字段） }
        related_challenge_slug:
          type: string
          nullable: true
          description: 关联题目 slug（题目 tutorial_slug 指向本 Room 时返回，可空）
    SubmissionRequest:
      type: object
      required: [challenge_slug, answer]
      properties:
        challenge_slug: { type: string }
        answer: { type: string }
    Submission:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, correct, incorrect] }
        score: { type: integer, description: 判定通过后返回的得分 }
    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer, description: 并列同分同名次（count-based，跨页一致） }
        username: { type: string }
        score: { type: integer }
        solved_count: { type: integer }
    Badge:
      type: object
      properties:
        code: { type: string, description: 徽章唯一码（如 first_solve） }
        title: { type: string }
        description: { type: string, description: 获得条件说明 }
        earned: { type: boolean, description: 当前用户是否已获得 }
    ContentPackage:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        latest_version: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        error: { type: string, description: 管线失败原因 }
    ContentVersion:
      type: object
      properties:
        id: { type: integer }
        version: { type: string, description: 语义化版本号 }
        status: { type: string, enum: [draft, published, archived] }
        checksum: { type: string, description: zip sha256 }
        created_at: { type: string, format: date-time }
    LabInstance:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [creating, running, stopped, destroyed] }
        endpoint: { type: string, description: 实例访问地址 }
        expire_at: { type: string, description: TTL 过期时间（RFC3339，UTC） }
        extend_count: { type: integer, description: 已续期次数（上限 2，达到后续期 422） }
        created_at: { type: string }
    InstanceConflict:
      type: object
      description: 单用户并发上限冲突（同时只允许一个活跃容器）
      properties:
        current: { $ref: '#/components/schemas/AdminLabInstance', description: 当前活跃实例（含题目信息，前端引导关闭） }
    InstanceLog:
      type: object
      description: 容器实例生命周期日志条目（append-only）
      properties:
        id: { type: integer }
        instance_id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        challenge_id: { type: integer }
        challenge_title: { type: string }
        challenge_slug: { type: string }
        action: { type: string, enum: [started, stopped], description: 生命周期动作 }
        source: { type: string, description: 触发来源（owner/admin/reaper） }
        status: { type: string, enum: [creating, running, stopped, destroyed], description: 动作时的实例状态 }
        detail: { type: string, description: 失败原因/补充信息（如 "ttl expired"） }
        created_at: { type: string }
    TrainingItem:
      type: object
      description: 训练场题目条目（独立 Challenge 资源，按 category 分组展示）
      properties:
        id: { type: integer, description: challenge_id }
        slug: { type: string }
        title: { type: string }
        category: { type: string, description: 分类 slug（训练场分组键） }
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        score: { type: integer }
        solved: { type: boolean, description: 当前用户是否已通关 }
        has_env: { type: boolean, description: 是否定义容器环境 }
        is_visible: { type: boolean, description: 可见性开关（false 学生端整体隐藏；仅管理端列表返回，学生端恒为 true） }
        release_at:
          type: string
          nullable: true
          description: 定时发布时间（RFC3339；到期前学生端隐藏。null = 立即发布语义，仅受 is_visible 约束）
        links:
          type: array
          description: 题目外链（配套工具/参考资料）
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
        tutorial_slug:
          type: string
          nullable: true
          description: 关联教程 Room slug（可选）
        tutorial_title:
          type: string
          nullable: true
          description: 关联教程 Room 标题
        tutorial_topic_slug:
          type: string
          nullable: true
          description: 关联教程所属 topic slug（前端跳转 Room 详情路由用）
    ChallengeDetail:
      type: object
      description: 题目详情（训练场点入页）
      allOf:
        - $ref: '#/components/schemas/TrainingItem'
        - type: object
          properties:
            description_md: { type: string, description: 题目描述 Markdown（背景/任务目标） }
            hints:
              type: array
              items: { $ref: '#/components/schemas/HintView' }
            attachments:
              type: array
              description: 题目附件列表（学生端凭 JWT 经 /challenges/{slug}/attachments/{filename} 下载）
              items: { $ref: '#/components/schemas/ChallengeAttachment' }
    HintView:
      type: object
      description: 提示视图。未解锁时 content 为空字符串；解锁后返回正文。
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string, description: 未解锁时为空 }
        cost: { type: integer, description: 解锁扣减积分（0 = 免费仍需点解锁） }
        unlocked: { type: boolean }
    HintUnlockResponse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        cost: { type: integer }
        unlocked: { type: boolean, enum: [true] }
        score: { type: integer, description: 解锁后的当前积分 }
    ChallengeJSON:
      type: object
      description: |
        题目定义 JSON（兼容批量导入的固定格式，单对象或对象数组）。
        带容器环境的题目推荐改用 challenge 包 zip（challenge.yml + Dockerfile + docker-compose.yml）。
      required: [slug, title, category, difficulty, score, challenge]
      properties:
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        description_md: { type: string }
        score: { type: integer }
        flag_mode:
          type: string
          enum: [shared, instance]
          default: shared
          description: "shared=题目级共享 flag；instance=每容器实例唯一（模板含 {token}，须有 env）"
        challenge:
          type: object
          required: [type, flag]
          properties:
            type: { type: string, enum: [static, regex] }
            flag: { type: string, description: "instance 模式下为含 {token} 的模板" }
        env:
          type: object
          description: 容器环境（image/port 要么都填要么都不填）
          properties:
            image: { type: string }
            port: { type: integer }
        hints:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              content: { type: string }
              cost: { type: integer }
        links:
          type: array
          description: 题目外链（配套工具/参考资料），随 challenge.json 上传存储
          items:
            type: object
            required: [name, url]
            properties:
              name: { type: string }
              url: { type: string }
        tutorial_slug: { type: string, description: 关联教程 Room slug（可选） }
    ChallengePackageUpload:
      type: object
      description: |
        实训常用题目包（zip）。必含 challenge.yml；带容器时还必含 Dockerfile 与 docker-compose.yml。
        详见 content-package-spec skill。
    ChallengeAttachment:
      type: object
      description: 题目附件元数据（文件落盘附件目录，学生端凭 JWT 下载）
      properties:
        filename: { type: string, description: 规范化文件名（下载 URL 段） }
        size: { type: integer, description: 字节数 }
        created_at: { type: string, description: RFC3339 }
    AdminLabInstance:
      type: object
      description: 管理端容器实例条目（LabInstance + 用户/题目富化）
      properties:
        id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        challenge_id: { type: integer }
        challenge_title: { type: string }
        challenge_slug: { type: string }
        status: { type: string, enum: [creating, running, stopped, destroyed] }
        endpoint: { type: string }
        expire_at: { type: string }
        created_at: { type: string }

  responses:
    ErrorResp:
      description: 统一错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [public]
      security: []
      summary: 健康检查（进程存活探针，无鉴权；compose healthcheck 使用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录换取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出（吊销当前 token）
      description: 按 JWT 的 jti 写入撤销表，令牌在自然过期前立即失效。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /auth/change-password:
    post:
      tags: [auth]
      summary: 修改本人密码
      description: 校验当前密码后更新；同时使该用户全部已签发 token 失效（需重新登录）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /me:
    get:
      tags: [auth]
      summary: 当前用户信息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /topics:
    get:
      tags: [student]
      summary: 主题列表（仅 published）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Topic' } }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /topics/{topicSlug}:
    get:
      tags: [student]
      summary: 主题详情（含 Room 列表）
      parameters:
        - { name: topicSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    put:
      tags: [admin]
      summary: 更新主题元数据（仅管理员）
      parameters:
        - { name: topicSlug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                summary: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /topics/{topicSlug}/rooms/{roomSlug}:
    get:
      tags: [student]
      summary: Room 详情（教程正文 + 内嵌 Lab）
      parameters:
        - { name: topicSlug, in: path, required: true, schema: { type: string } }
        - { name: roomSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/instance:
    post:
      tags: [student]
      summary: 启动/获取本人在该题目的环境实例（幂等；instance flag_mode 时注入唯一 FLAG）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK（已存在则直接返回）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabInstance' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '409':
          description: 已有活跃容器（同时只允许一个，返回当前实例引导关闭）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { $ref: '#/components/schemas/Error' }
                  current: { $ref: '#/components/schemas/AdminLabInstance' }
        '422': { $ref: '#/components/responses/ErrorResp' }
        '501': { $ref: '#/components/responses/ErrorResp' }
    get:
      tags: [student]
      summary: 查询本人在该题目的环境实例状态（无实例返回 null）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LabInstance'
                  - nullable: true
        '404': { $ref: '#/components/responses/ErrorResp' }
    delete:
      tags: [student]
      summary: 销毁本人在该题目的环境实例
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/instance/extend:
    post:
      tags: [student]
      summary: 续期实例 TTL（不重建容器；expire_at = now+1h；每实例最多续期 2 次）
      description: 已续期 2 次后再续期返回 422（治理约束：防止容器被无限占用，
        单容器 TTL 上限 3 小时 = 初始 1h + 续期 2×1h）。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabInstance' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /checkpoints/{token}:
    post:
      tags: [env]
      security: []
      summary: 环境检测点自动判定回调（题目容器内 checker 调用，token 能力鉴权，非 JWT）
      description: >
        实例启动时服务端向容器注入 CHECKPOINT_TOKEN 与 CHECKPOINT_URL 两个环境变量。
        题目内置 checker 检测到目标达成后 POST CHECKPOINT_URL（无需 body）。
        token 命中活跃实例即入队一条自动判定提交（哨兵答案，不出现在提交接口可用的取值里），
        由异步 worker 走与手动提交完全相同的管线判过计分（防重复通关、动态计分、room.completed）。
        语义参考 PortSwigger lab 的服务端通关按钮。
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: 已入队（异步判定，结果经 GET /submissions/{id} 或题目详情 solved 字段体现）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending] }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}:
    get:
      tags: [student]
      summary: 题目详情（描述 markdown + hints + 关联教程）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeDetail' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/hints/{hintId}/unlock:
    post:
      tags: [student]
      summary: 扣分解锁提示（写 hint.unlocked 事件；已解锁则幂等返回正文）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: hintId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HintUnlockResponse' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422':
          description: 积分不足或其他校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /submissions:
    post:
      tags: [student]
      summary: 提交答案（异步判定，返回 pending）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionRequest' }
      responses:
        '202':
          description: Accepted（已入队）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /submissions/{id}:
    get:
      tags: [student]
      summary: 查询判定结果
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges:
    get:
      tags: [student]
      summary: 训练场题目列表（跨 Topic 全量，含当前用户 solved/has_env；隐藏/未到发布时间的题目已过滤）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/TrainingItem' } }

  /progress:
    get:
      tags: [student]
      summary: 个人进度（事件派生数据）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  xp: { type: integer }
                  completed_rooms: { type: integer }
                  in_progress_rooms: { type: integer }

  /leaderboard:
    get:
      tags: [student]
      summary: 排行榜（事件派生数据）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/LeaderboardEntry' } }

  /badges:
    get:
      tags: [student]
      summary: 徽章列表（含当前用户获得状态；徽章是积分/进度派生数据的计算型读模型，不落库）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Badge' }

  /content/packages:
    get:
      tags: [admin]
      summary: 内容包列表（分页）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ContentPackage' } }
        '401': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 上传内容包（进入五步管线）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  format: binary
                  description: 内容包 zip（结构见 content-package-spec skill）
      responses:
        '201':
          description: Created（draft 状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}:
    get:
      tags: [admin]
      summary: 内容包状态与版本
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}/publish:
    post:
      tags: [admin]
      summary: 发布内容包（draft → published）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}/versions:
    get:
      tags: [admin]
      summary: 内容包版本列表（含各版本状态）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentVersion' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}/archive:
    post:
      tags: [admin]
      summary: 归档内容包（published → archived，包级冻结，内容表不动）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}/rollback:
    post:
      tags: [admin]
      summary: 回滚内容包到指定历史版本（目标版本 Payload 重写内容表）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id]
              properties:
                version_id: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges:
    get:
      tags: [admin]
      summary: 题目全量列表（管理端题目管理表格，分页）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/TrainingItem'
                            - type: object
                              properties:
                                description_md: { type: string }
        '403': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 上传题目定义 JSON（单个对象或对象数组，upsert 生效；无容器题目可用）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ChallengeJSON'
                - type: array
                  items: { $ref: '#/components/schemas/ChallengeJSON' }
      responses:
        '200':
          description: OK（返回导入数量与 slugs）
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  slugs: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/package:
    post:
      tags: [admin]
      summary: 上传实训常用题目包 zip（必含 challenge.yml；有容器时必含 Dockerfile + docker-compose.yml）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  format: binary
                  description: 题目包 zip
      responses:
        '200':
          description: OK（upsert 单题）
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  slugs: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/{slug}:
    delete:
      tags: [admin]
      summary: 删除题目（级联删除 flags/hints/attachments；存在通关记录时拒绝）
      description: |-
        题目存在任一用户通关记录（submission 事件历史）时返回 409——
        事件溯源下提交历史 append-only 不可删，删除题目会制造悬挂积分。
        无通关记录时：销毁该题目全部运行中实例，级联删除 flags/hints/attachments/lab_instances 行
        并清理附件目录。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '409':
          description: 题目存在通关记录，拒绝删除（事件历史不可删）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/challenges/{slug}/visibility:
    patch:
      tags: [admin]
      summary: 更新题目可见性 / 定时发布
      description: |-
        is_visible=false 或 release_at 在未来时，学生端训练场列表、题目详情、
        实例启动、答案提交、提示解锁对该题返回 404（隐藏语义同不存在）。
        已有通关记录不受影响（事件历史 append-only 不动），题目重新可见后恢复开放。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                is_visible: { type: boolean }
                release_at:
                  type: string
                  nullable: true
                  description: RFC3339；null = 清除定时（立即语义）
      responses:
        '200':
          description: OK（返回更新后的题目可见性状态）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingItem'
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/{slug}/attachments:
    get:
      tags: [admin]
      summary: 题目附件列表（管理端）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChallengeAttachment' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 上传题目附件（multipart，单文件 ≤50MB，文件名规范化存储）
      description: 附件落盘 ACADEMY_ATTACHMENTS_DIR/&lt;slug&gt;/，同名覆盖；重复文件名 = 覆盖更新。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeAttachment' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/{slug}/attachments/{filename}:
    delete:
      tags: [admin]
      summary: 删除题目附件（删元数据行 + 磁盘文件）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/attachments/{filename}:
    get:
      tags: [student]
      summary: 下载题目附件（登录即可；Content-Disposition 附文件名）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 附件二进制
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /admin/lab-instances:
    get:
      tags: [admin]
      summary: 全部 Lab 容器实例（分页，含用户/题目富化）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminLabInstance' } }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /admin/lab-instances/active:
    get:
      tags: [admin]
      summary: 当前活跃容器（creating/running，管理端概览卡片）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminLabInstance' } }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /admin/lab-instances/logs:
    get:
      tags: [admin]
      summary: 容器实例生命周期日志（started/stopped，分页，管理端日志表格）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/InstanceLog' } }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /admin/lab-instances/{id}:
    delete:
      tags: [admin]
      summary: 强制销毁实例（写 lab.instance.stopped 事件，payload source=admin）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /admin/users:
    get:
      tags: [admin]
      summary: 用户列表（分页）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/User' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LoginRequest'
                - type: object
                  properties:
                    global_role: { type: string, enum: [student, admin], default: student, description: student=普通人，admin=管理员 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /admin/users/{id}/roles:
    patch:
      tags: [admin]
      summary: 修改全局角色（student=普通人 / admin=管理员）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                global_role: { type: string, enum: [student, admin], description: student=普通人，admin=管理员 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /admin/users/{id}/reset-password:
    post:
      tags: [admin]
      summary: 重置用户密码（使该用户全部已签发 token 失效）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

