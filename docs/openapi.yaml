            schema: { $ref: '#/components/schemas/CompetitionProfileInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionProfileView' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/view:
    get:
      tags: [competitions]
      summary: 竞赛首页（参赛者视角：题目列表、我的队伍、我的提交、倒计时、看板聚合）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  competition: { $ref: '#/components/schemas/Competition' }
                  team_name: { type: string, nullable: true }
                  teammates: { type: array, items: { type: string } }
                  challenges: { type: array, items: { $ref: '#/components/schemas/CompetitionChallengeItem' } }
                  my_submissions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        status: { type: string, enum: [pending, correct, incorrect] }
                        score: { type: integer }
                        created_at: { type: string }
                  analytics: { $ref: '#/components/schemas/CompetitionAnalytics' }
                  writeup_submitted: { type: boolean, description: 是否已提交任一题 WP（结束后；队伍模式任一队员提交即为 true） }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/challenges/{slug}/instance:
    post:
      tags: [competitions]
      summary: 启动竞赛题目容器（单容器约束：仅限本竞赛题目）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabInstance' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '409':
          description: 单容器冲突（同时只允许一个活跃容器）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ErrorResp' }

