        checker_config: { type: string, description: checker 配置 JSON }
        base_score: { type: integer }
        sla_weight: { type: integer, description: SLA 权重百分比 0..100 }
        attack_points: { type: integer, description: 每回合攻击分池 }
        defense_loss: { type: integer, description: 每个受害服务每回合扣分 }
