    post:
      tags: [competitions]
      summary: 公开赛报名（仅 public 竞赛；未结束即可报名；已报名幂等返回；邀请赛 422）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicCompetitionItem' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/me:
    get:
      tags: [competitions]
