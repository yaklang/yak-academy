      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionProfileView' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    put:
      tags: [competitions]
      summary: 参赛者补填/修改本人名册（竞赛结束后冻结）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
