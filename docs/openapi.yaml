    post:
      tags: [competitions]
      summary: 竞赛内提交 flag（异步判定；提交其他队伍 flag 触发反作弊警告）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_slug, answer]
