openapi: 3.0.3
info:
  title: yak-academy API
  version: 0.1.0
  description: |
    yak-academy 安全实训平台 API 契约（唯一契约源）。
    规则：改接口必须先改本文件，再改后端 handler，再改前端 src/api/。
    统一错误信封：{"error":{"code","message"}}。
    第一版所有接口允许 stub 返回 501，但路由必须注册。
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: auth
  - name: student
  - name: admin
  - name: env
  - name: public
  - name: competitions

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, CONFLICT, INSTANCE_CONFLICT, NOT_IMPLEMENTED, INTERNAL]
            message:
              type: string
              description: 面向用户的中文提示（统一报错接入口 backend/internal/api/error_messages.go 映射）；英文原文记录在服务端 error 日志（slog api_error）
    YakEngineStatus:
      type: object
      required: [configured, path, version, download]
      properties:
        configured: { type: boolean, description: 引擎已装配（code 判定与自测运行可用） }
        path: { type: string, description: 当前引擎路径；未装配时为下载目标路径 }
        version: { type: string, description: 已知引擎版本（下载完成时解析；未知为空） }
        download:
          type: object
          required: [state, received, total]
          properties:
            state: { type: string, enum: [idle, running, done, failed] }
            received: { type: integer, description: 已接收字节数 }
            total: { type: integer, description: 总字节数（Content-Length；未知为 -1） }
            error: { type: string, description: 失败原因（state=failed 时） }
    Page:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    BackupInfo:
      type: object
      required: [name, size_bytes, created_at, database, store_kinds]
      properties:
        name: { type: string, description: 归档文件名（academy-YYYYMMDD-HHMMSS.tar.gz） }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
        database: { type: string, description: 数据库模式（sqlite；归档内含一致性快照） }
        store_kinds: { type: string, description: WP 附件存储后端（fs/s3；s3 时 WP zip 不在归档内） }
    AdminSMTPSettings:
      type: object
      description: 管理端邮件服务配置（统一管理；密码只写不读，落库前 AES-256-GCM 加密）
      required: [enabled, addr, username, from, tls, has_password, password_error, config_error, source]
      properties:
        enabled: { type: boolean, description: 是否启用 SMTP 投递；关闭时邮箱验证码不可用（非严格模式回退开发日志投递器） }
        addr: { type: string, description: SMTP 地址 host:port（省略端口按 587） }
        username: { type: string, description: SMTP 登录账号（空 = 不认证，仅限内网中继） }
        from: { type: string, description: 发件人（可含显示名；空则取 username） }
        tls: { type: string, enum: [starttls, implicit, none], description: TLS 模式：starttls（587）/ implicit（465）/ none（仅限内网） }
        has_password: { type: boolean, description: 是否已保存密码；密码原文永不返回 }
        password_error: { type: boolean, description: 已保存密码无法解密（通常为 JWT secret 变更）；需重新填写密码 }
        config_error: { type: boolean, description: 已保存配置损坏；再次保存即可覆盖修复 }
        source: { type: string, enum: [database, environment, none], description: 当前生效配置来源；保存后恒为 database }
        updated_at: { type: string, format: date-time, nullable: true, description: 最后保存时间（来源为 environment 时为 null） }
        updated_by: { type: string, description: 最后保存的管理员用户名（来源为 environment 时为空） }
    AdminSMTPSettingsUpdate:
      type: object
      description: 保存邮件服务配置；保存成功后立即热加载，无需重启服务
      required: [enabled, addr, username, from, tls]
      properties:
        enabled: { type: boolean }
        addr: { type: string, description: 启用时必填；host:port，省略端口按 587 }
        username: { type: string }
        password: { type: string, description: 新密码；空 = 保留已保存密码（首次保存且来源为环境变量时沿用环境变量密码） }
        from: { type: string }
        tls: { type: string, enum: [starttls, implicit, none] }
    AdminSMTPTestRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, format: email, description: 测试收件邮箱 }
    AdminAuditLog:
      type: object
      description: 管理操作审计行（append-only；与 Event 学生行为流分工，不参与事件重放）
      properties:
        id: { type: integer }
        admin_id: { type: integer }
        admin_name: { type: string }
        action: { type: string, description: 动作（如 content.publish、user.roles、competition.create） }
        target_type: { type: string, description: 目标类型（package/challenge/user/competition/backup/…） }
        target_id: { type: string, description: 目标标识（ID/slug/文件名等） }
        detail: { type: object, nullable: true, description: 动作附加详情（JSON；无则为 null） }
        ip: { type: string, description: 来源地址（剥端口后的 host） }
        created_at: { type: string, format: date-time }
    PerformanceReport:
      type: object
      description: 主机/容器性能快照（docker info/stats + Linux /proc + statfs；不可用字段为 null）
      properties:
        ncpu: { type: integer, description: 宿主 CPU 核数（docker info） }
        mem_total_bytes: { type: integer, description: 宿主内存总量（docker info） }
        containers_total: { type: integer }
        containers_running: { type: integer }
        containers_paused: { type: integer }
        containers_stopped: { type: integer }
        images: { type: integer }
        host:
          type: object
          nullable: true
          properties:
            cpu_percent: { type: number, nullable: true, description: 宿主 CPU 占用率（/proc/stat 两次采样；非 Linux 为 null） }
            mem_total_bytes: { type: integer }
            mem_used_bytes: { type: integer, nullable: true, description: 宿主已用内存（/proc/meminfo；非 Linux 为 null） }
        data_volume:
          type: object
          nullable: true
          properties:
            path: { type: string }
            total_bytes: { type: integer }
            used_bytes: { type: integer }
            avail_bytes: { type: integer }
        containers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              cpu_percent: { type: number }
              mem_used_bytes: { type: integer }
              mem_limit_bytes: { type: integer }
              mem_percent: { type: number }
              net_io_bytes:
                type: array
                items: { type: integer, nullable: true }
                description: "[收, 发]；解析失败为 null 元素"
              block_io_bytes:
                type: array
                items: { type: integer, nullable: true }
                description: "[读, 写]；解析失败为 null 元素"
              pids: { type: integer }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        global_role: { type: string, enum: [student, admin], description: student=普通人，admin=管理员 }
        account_code: { type: string, description: 用户账号编码（YA+两位年份-五位零填充序号，如 YA26-00042；建号自动分配、不可变，用于表格导入与人工对照） }
        email: { type: string, description: 历史账号邮箱（邮箱注册已下线；微信/导入建号可为空） }
        phone: { type: string, description: 历史账号手机号（手机号注册已下线；微信/导入建号可为空） }
        password_set: { type: boolean, description: 是否设置密码；微信注册账号为 false（只能微信登录），管理员重置密码后变为 true }
    AdminUserItem:
      type: object
      description: 管理端用户条目：基础字段 + 活跃度与解题画像（过滤/标记依据）
      properties:
        id: { type: integer }
        username: { type: string }
        account_code: { type: string }
        global_role: { type: string, enum: [student, admin] }
        email: { type: string, description: 历史账号邮箱（邮箱注册已下线；微信/导入建号可为空） }
        phone: { type: string, description: 历史账号手机号（手机号注册已下线；微信/导入建号可为空） }
        created_at: { type: string, description: 注册时间（RFC3339） }
        last_login_at: { type: string, nullable: true, description: 最近登录时间（从未登录为 null） }
        active: { type: boolean, description: 是否活跃：最近登录（无则注册时间）在 6 个月内 }
        solved_any: { type: boolean, description: 是否完成过任意题目（存在判定通过的提交） }
    UserProfile:
      type: object
      description: 账号信息面板（本人视角）：内置账号 ID、账号名称、简介、总得分、头像。
      properties:
        id: { type: integer, description: 内置账号 ID }
        username: { type: string, description: 账号名称 }
        global_role: { type: string, enum: [student, admin] }
        bio: { type: string, description: 描述简介（≤500 字，可空） }
        score: { type: integer, description: 总得分（事件派生数据，只读） }
        solve_count: { type: integer, description: 解题数（事件派生数据，只读） }
        avatar: { type: string, nullable: true, description: 头像 URL（未上传为 null） }
        created_at: { type: string, description: 注册时间（RFC3339） }
    CapabilityDimension:
      type: object
      description: 能力画像的一个题目分类维度（仅统计当前可见且已发布的题目）。
      required: [category, solved, total]
      properties:
        category: { type: string, description: 题目分类 slug }
        solved: { type: integer, description: 已通关去重题数 }
        total: { type: integer, description: 该分类可见题目总数 }
    CapabilityProfile:
      type: object
      description: 当前用户能力画像：按题目分类聚合的通关覆盖（只读派生视图）。
      required: [dimensions, solved, total]
      properties:
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/CapabilityDimension' }
        solved: { type: integer, description: 可见题目中已通关的去重题数 }
        total: { type: integer, description: 可见题目总数 }
    MailItem:
      type: object
      description: 站内邮件（只收不发）：竞赛邀请等系统通知。
      properties:
        id: { type: integer }
        title: { type: string }
        body_md: { type: string, description: 正文 Markdown }
        kind: { type: string, enum: [invite], description: invite=竞赛邀请（附邀请码） }
        competition_id: { type: integer, nullable: true, description: 竞赛邀请关联的竞赛 ID }
        invite_code: { type: string, nullable: true, description: 竞赛邀请码（kind=invite 时必有） }
        read: { type: boolean, description: 是否已读 }
        created_at: { type: string, description: RFC3339 }
    Topic:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        room_count: { type: integer }
    Room:
      type: object
      properties:
        slug: { type: string }
        topic_slug: { type: string }
        title: { type: string }
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        lesson_md: { type: string, description: 教程正文 Markdown }
        video_url: { type: string, description: "视频教程地址（可选，lesson.md front matter video 字段；仅 http/https 绝对地址，mp4/webm 直链或可嵌入页面）" }
        flow:
          type: array
          items: { type: string }
          description: "教程流程节点（可选，lesson.md front matter flow 字段；2-12 步，每步 ≤120 字符）"
        related_challenge_slug:
          type: string
          nullable: true
          description: 关联题目 slug（题目 tutorial_slug 指向本 Room 时返回，可空）
    SubmissionRequest:
      type: object
      required: [challenge_slug, answer]
      properties:
        challenge_slug: { type: string }
        answer: { type: string, description: "flag 判定题：flag 文本；ACM 编程题：yak 源码全文（判定不用 flag）" }
    Submission:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, correct, incorrect] }
        score: { type: integer, description: 判定得分（ACM 部分得分制：全过 = 题面全额；部分通过组按组分值权重折算） }
        verdict:
          type: string
          nullable: true
          enum: [ac, wa, tle, re, internal_error]
          description: |
            ACM 编程题判定结果（flag 判定题为 null）：ac=全部数据通过；wa=输出不匹配；
            tle=超时；re=运行出错/内存超限；internal_error=引擎不可用等平台侧失败
            （不消耗题目的判定机会，可稍后重试）。
        groups:
          type: array
          nullable: true
          description: |
            ACM 编程题逐组判定明细（部分得分制；flag 判定题为 null）。判定对全部
            数据组逐组运行（非首败即停），每组独立结论；通过组的分值权重折算进 score。
            样例组（sample=true）学生可见名称，隐藏组仅展示序号名。
          items:
            type: object
            properties:
              name: { type: string }
              sample: { type: boolean }
              passed: { type: boolean }
              verdict: { type: string, enum: [wa, tle, re], description: 失败组的判定 }
              score: { type: integer, description: 组配置分值（0 = 未配置，按权重均分语义不适用） }
    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer, description: 并列同分同名次（count-based，跨页一致） }
        username: { type: string }
        score: { type: integer }
        solved_count: { type: integer }
        last_active_at: { type: string, format: date-time, nullable: true, description: 最近一次积分变动时间（通关得分或提示扣分） }
    LeaderboardStats:
      type: object
      description: 全站排行榜聚合（事件派生表的只读统计）
      properties:
        participants: { type: integer, description: 有积分记录的上榜学员数 }
        total_score: { type: integer, description: 累计积分（含提示扣分） }
        total_solves: { type: integer, description: 累计通关题次 }
        average_score: { type: integer, description: 平均积分（向下取整） }
        top_score: { type: integer, description: 榜首积分（相对分数条基准） }
        updated_at: { type: string, format: date-time, nullable: true, description: 最近一次积分变动时间 }
    ScoreDistributionBand:
      type: object
      description: 积分分布区间（按榜首积分动态分 5 档，负分单独一档）
      properties:
        label: { type: string, description: 区间标签（如 0–19、100+、负分） }
        count: { type: integer, description: 落在该区间的学员数 }
    Badge:
      type: object
      properties:
        code: { type: string, description: 徽章唯一码（如 first_solve） }
        title: { type: string }
        description: { type: string, description: 获得条件说明 }
        earned: { type: boolean, description: 当前用户是否已获得 }
    ContentPackage:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        latest_version: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        error: { type: string, description: 管线失败原因 }
    ContentVersion:
      type: object
      properties:
        id: { type: integer }
        version: { type: string, description: 语义化版本号 }
        status: { type: string, enum: [draft, published, archived] }
        checksum: { type: string, description: zip sha256 }
        created_at: { type: string, format: date-time }
    LabInstance:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [creating, running, stopped, destroyed] }
        endpoint: { type: string, description: 实例访问地址（http://<主机>:<随机宿主端口>；主机由 ACADEMY_INSTANCE_PUBLIC_HOST 决定，默认 127.0.0.1 仅宿主本机可达，服务器部署设学员可达的宿主地址） }
        expire_at: { type: string, description: TTL 过期时间（RFC3339，UTC） }
        extend_count: { type: integer, description: 已续期次数（上限 2，达到后续期 422） }
        created_at: { type: string }
    InstanceConflict:
      type: object
      description: 单用户并发上限冲突（同时只允许一个活跃容器）
      properties:
        current: { $ref: '#/components/schemas/AdminLabInstance', description: 当前活跃实例（含题目信息，前端引导关闭） }
    InstanceLog:
      type: object
      description: 容器实例生命周期日志条目（append-only）
      properties:
        id: { type: integer }
        instance_id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        challenge_id: { type: integer }
        challenge_title: { type: string }
        challenge_slug: { type: string }
        action: { type: string, enum: [started, stopped], description: 生命周期动作 }
        source: { type: string, description: 触发来源（owner/admin/reaper） }
        status: { type: string, enum: [creating, running, stopped, destroyed], description: 动作时的实例状态 }
        detail: { type: string, description: 失败原因/补充信息（如 "ttl expired"） }
        created_at: { type: string }
    TrainingItem:
      type: object
      description: 题库题目条目（独立 Challenge 资源，页内按 bank 分 tab、category 分组展示）
      properties:
        id: { type: integer, description: challenge_id }
        slug: { type: string }
        title: { type: string }
        category: { type: string, description: 分类 slug（题库页分组键） }
        bank:
          type: string
          enum: [tutorial, ctf, acm, basic]
          description: |
            题库 tab（tutorial=教程题目，专属内置题集，仅一键导入写入；ctf=CTF 题目，上传缺省；
            acm=ACM 题目；basic=基础题，单选/多选/判断/填空，仅训练场可用，禁止绑定 CTF 竞赛）。
        type:
          type: string
          enum: [static, regex, code, single, multiple, truefalse, fill]
          description: |
            判定类型（多态）：static/regex=flag 题；code=ACM 编程题；
            single/multiple/truefalse/fill=基础题（训练场专用）。
        is_builtin: { type: boolean, description: 是否来自官方内置训练题集（一键导入标记；普通上传不改动） }
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        score: { type: integer }
        solved: { type: boolean, description: 当前用户是否已通关 }
        has_env: { type: boolean, description: 是否定义容器环境 }
        is_visible: { type: boolean, description: 可见性开关（false 学生端整体隐藏；仅管理端列表返回，学生端恒为 true） }
        release_at:
          type: string
          nullable: true
          description: 定时发布时间（RFC3339；到期前学生端隐藏。null = 立即发布语义，仅受 is_visible 约束）
        links:
          type: array
          description: 题目外链（配套工具/参考资料）
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
        tutorial_slug:
          type: string
          nullable: true
          description: 关联教程 Room slug（可选）
        tutorial_title:
          type: string
          nullable: true
          description: 关联教程 Room 标题
        tutorial_topic_slug:
          type: string
          nullable: true
          description: 关联教程所属 topic slug（前端跳转 Room 详情路由用）
    ChallengeDetail:
      type: object
      description: 题目详情（训练场点入页）
      allOf:
        - $ref: '#/components/schemas/TrainingItem'
        - type: object
          properties:
            description_md: { type: string, description: 题目描述 Markdown（背景/任务目标） }
            question:
              allOf:
                - $ref: '#/components/schemas/QuestionView'
              description: |
                基础题视图（仅 bank=basic 的 single/multiple/truefalse/fill 返回）。
                不含标准答案；explanation 仅在当前用户已通关时下发。
            judge:
              type: object
              nullable: true
              description: |
                ACM 编程题判定配置（flag 判定题为 null）：学生提交 yak 源码，
                worker 对每组测试数据运行比对（sample=true 的组是样例，其余隐藏）。
                测试数据内容不下发——样例经 /challenges/{slug}/judge/samples 端点提供。
              properties:
                engine: { type: string, enum: [yak] }
                time_limit_s: { type: integer, description: 单组数据时限（秒） }
                memory_limit_mb: { type: integer, description: 单组数据内存上限（MB） }
                testdata_count: { type: integer, description: 测试数据组数（含样例） }
                allowed_libs:
                  type: array
                  nullable: true
                  description: |
                    题目级 yak 库白名单（judge.allowed_libs 配置；null = 未配置，
                    允许全部非黑名单库）。服务端已扣除全局黑名单；编辑器补全与
                    提交/自测拦截均以此为准。
                  items: { type: string }
                blocked_libs:
                  type: array
                  description: 平台全局 yak 库黑名单（exec/cli/file 等高危库；env ACADEMY_YAK_LIB_BLACKLIST 可覆盖）——任何题目不可使用。
                  items: { type: string }
                engine_available:
                  type: boolean
                  description: |
                    判定引擎是否已装配（ACADEMY_YAK_BIN 配置或管理端下载）。
                    false 时前端禁用提交/自测入口并提示联系管理员，代替点击后才
                    收到 internal_error / 422 的滞后反馈。
            hints:
              type: array
              items: { $ref: '#/components/schemas/HintView' }
            attachments:
              type: array
              description: 题目附件列表（学生端凭 JWT 经 /challenges/{slug}/attachments/{filename} 下载）
              items: { $ref: '#/components/schemas/ChallengeAttachment' }
    HintView:
      type: object
      description: 提示视图。未解锁时 content 为空字符串；解锁后返回正文。
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string, description: 未解锁时为空 }
        cost: { type: integer, description: 解锁扣减积分（0 = 免费仍需点解锁） }
        unlocked: { type: boolean }
    HintUnlockResponse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        cost: { type: integer }
        unlocked: { type: boolean, enum: [true] }
        score: { type: integer, description: 解锁后的当前积分 }
    QuestionOption:
      type: object
      required: [key, text]
      properties:
        key: { type: string, description: '选项 key（大写字母/数字，1-8 位）' }
        text: { type: string, description: '选项文本（<=500 字）' }
    QuestionMatch:
      type: object
      description: 填空匹配策略（仅 fill；缺省 trim=true、case_sensitive=false、regex=false）
      properties:
        case_sensitive: { type: boolean, default: false }
        trim: { type: boolean, default: true }
        regex: { type: boolean, default: false, description: 'true 时每个可接受答案按正则匹配' }
    QuestionView:
      type: object
      description: 基础题学生端视图（不含标准答案；解析仅通关后返回）
      properties:
        type:
          type: string
          enum: [single, multiple, truefalse, fill]
        options:
          type: array
          items: { $ref: '#/components/schemas/QuestionOption' }
        match:
          $ref: '#/components/schemas/QuestionMatch'
          description: 仅填空题返回匹配策略
        explanation: { type: string, description: 解析（仅已通关时返回，未通关为空） }
    QuestionJSON:
      type: object
      description: |
        基础题定义（challenge.json question 段 / challenge.yml 同构）。
        与 challenge、judge 三选一互斥；基础题只能 bank=basic，不支持 env/flag_mode。
      required: [type, answer]
      properties:
        type: { type: string, enum: [single, multiple, truefalse, fill] }
        options:
          type: array
          description: 单选/多选必填 2-26 个；判断/填空不允许
          items: { $ref: '#/components/schemas/QuestionOption' }
        answer:
          description: 'single: "A"；multiple: ["A","C"]；truefalse: true；fill: "答案" 或 ["答案1","答案2"]'
        match:
          $ref: '#/components/schemas/QuestionMatch'
          description: 仅填空题可用
        explanation: { type: string, description: 解析（可选，<=16KiB；学生通关后可见） }
    ChallengeJSON:
      type: object
      description: |
        题目定义 JSON（兼容批量导入的固定格式，单对象或对象数组）。
        判定定义三选一互斥：challenge（flag 题）/ judge（ACM 编程题）/ question（基础题）。
        带容器环境的题目推荐改用 challenge 包 zip（challenge.yml + Dockerfile + docker-compose.yml）。
      required: [slug, title, category, difficulty, score]
      properties:
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        bank:
          type: string
          enum: [ctf, acm, basic]
          default: ctf
          description: |
            题库 tab。上传路径仅可选 ctf / acm / basic（传 tutorial 一律 422——教程题目
            tab 专属官方内置题集，仅 POST /admin/challenges/builtin 一键导入写入）。
            question 段存在时必须是 basic（缺省自动归 basic），且仅训练场可用、禁止绑定
            CTF 竞赛。缺省：新建题默认 ctf；重传已有题保留原值。
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        description_md: { type: string }
        score: { type: integer }
        flag_mode:
          type: string
          enum: [shared, instance]
          default: shared
          description: "shared=题目级共享 flag；instance=每容器实例唯一（模板含 {token}，须有 env）；基础题/编程题不允许 instance"
        challenge:
          type: object
          required: [type, flag]
          description: |
            flag 判定定义（static/regex）。ACM 编程题（judge 段）与基础题（question 段）
            不判定 flag，challenge 段整体省略；否则必填。
          properties:
            type: { type: string, enum: [static, regex] }
            flag: { type: string, description: "instance 模式下为含 {token} 的模板" }
        question:
          allOf:
            - $ref: '#/components/schemas/QuestionJSON'
          description: |
            基础题定义（bank=basic 必填；与 challenge / judge 互斥）。
            单选/多选/判断/填空四种题型；不支持 env，不接受 flag 判定。
        judge:
          type: object
          description: |
            ACM 编程题判定定义（bank=acm 必填；flag 题/基础题出现该段一律 422）。
            ACM 题不通过 flag 判定——学生提交 yak 源码，judge worker 用引擎执行
            并对拍测试数据（对齐 ICPC 模型：样例 + 隐藏数据逐组运行、token 忽略
            行尾空白比对、时限/内存限制、AC/WA/TLE/RE 判定）。题目包 zip 中
            测试数据文件放 testdata/ 目录，由包上传管线存入 judge.testdata；
            challenge.json 直传（无 zip）无法携带数据文件，仅适合包路径。
          required: [engine, time_limit_s, testdata]
          properties:
            engine: { type: string, enum: [yak], description: 判题引擎（第一版仅 yaklang yak） }
            time_limit_s:
              type: integer
              minimum: 1
              maximum: 60
              description: 单组测试数据的运行时限（秒；worker 对引擎进程整体计时，超时判 TLE）
            memory_limit_mb:
              type: integer
              minimum: 16
              maximum: 512
              default: 128
              description: 单组测试数据的内存上限（MB；超限判 RE）
            allowed_libs:
              type: array
              description: |
                yak 库白名单（防高危库执行）：配置后学生源码只能引用这些库
                （其余库一律 422 拒绝）；留空/缺省 = 允许全部（全局黑名单除外）。
                值必须是 yaklang 命名空间库名（如 str/codec/io/json/time/os）；
                配置黑名单库（exec/file 等）→ 422。提交与自测运行在受理前做
                静态扫描拦截（标识符级，含 `a := exec` 这类别名引用）。
              items: { type: string }
            testdata:
              type: array
              minItems: 1
              description: 测试数据组（.in/.answer 成对；sample=true 的组学生可见样例）
              items:
                type: object
                required: [name, input, output]
                properties:
                  name: { type: string, description: 组名（包内文件去扩展名；展示用） }
                  input: { type: string, description: 输入数据全文 }
                  output: { type: string, description: 期望输出全文 }
                  sample: { type: boolean, default: false, description: 是否样例组（题面样例；隐藏组 false） }
        env:
          type: object
          description: 容器环境（image/port 要么都填要么都不填）
          properties:
            image: { type: string }
            port: { type: integer }
        hints:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              content: { type: string }
              cost: { type: integer }
        links:
          type: array
          description: 题目外链（配套工具/参考资料），随 challenge.json 上传存储
          items:
            type: object
            required: [name, url]
            properties:
              name: { type: string }
              url: { type: string }
        tutorial_slug: { type: string, description: 关联教程 Room slug（可选） }
    ChallengePackageUpload:
      type: object
      description: |
        实训常用题目包（zip）。必含 challenge.yml；带容器时还必含 Dockerfile 与 docker-compose.yml。
        基础题（challenge.yml 带 question 段、bank=basic）不需要 Dockerfile / docker-compose.yml / testdata。
        ACM 编程题（challenge.yml 带 judge 段）包内以 testdata/ 目录携带数据文件：
        testdata/<组名>.in 输入、testdata/<组名>.answer 期望输出（对齐 ICPC .in/.ans
        惯例，期望输出用 .answer 避开构建工具对 .ans 的误处理），组名建议 01/02/03
        序号；题面样例组在 challenge.yml judge.testdata 里按 name 标 sample: true。
        详见 content-package-spec skill。
    ChallengeAttachment:
      type: object
      description: 题目附件元数据（文件落盘附件目录，学生端凭 JWT 下载）
      properties:
        filename: { type: string, description: 规范化文件名（下载 URL 段） }
        size: { type: integer, description: 字节数 }
        created_at: { type: string, description: RFC3339 }
    AdminLabInstance:
      type: object
      description: 管理端容器实例条目（LabInstance + 用户/题目富化）
      properties:
        id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        challenge_id: { type: integer }
        challenge_title: { type: string }
        challenge_slug: { type: string }
        status: { type: string, enum: [creating, running, stopped, destroyed] }
        endpoint: { type: string }
        expire_at: { type: string }
        created_at: { type: string }
    Competition:
      type: object
      description: 竞赛实体（管理端创建/配置；状态由当前时刻与起止时间派生）
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [public, invitational], description: public=公开赛（竞赛广场公开展示，用户自助报名）/ invitational=邀请赛（定向导入参赛者，凭邀请码入场）；创建后不可更改 }
        format: { type: string, enum: [ctf, awd, exam], description: 竞赛形式：ctf=解题赛 / awd=攻防赛 / exam=在线考试；创建后不可更改 }
        scoring_mode: { type: string, enum: [dynamic, fixed], description: 仅 CTF 生效：dynamic=按通过人数衰减 / fixed=按题目分值固定计分；开赛后不可切换 }
        bonus_cap: { type: integer, description: CTF 单人正向附加分上限；0=不限制，仅 CTF 可配置 }
        registration_start: { type: string, format: date-time, nullable: true, description: 公开赛报名开始时间；与 registration_end 同时配置或同时为空（空=报名开放到竞赛结束） }
        registration_end: { type: string, format: date-time, nullable: true, description: 公开赛报名截止时间；不得晚于 end_time }
        description: { type: string, description: 竞赛说明（Markdown） }
        start_time: { type: string, format: date-time, description: 开赛时间（RFC3339） }
        end_time: { type: string, format: date-time, description: 结束时间（RFC3339）；结束后解除参赛锁定、开放 WP 提交 }
        status: { type: string, enum: [scheduled, running, ended], description: scheduled=未开始 / running=进行中 / ended=已结束 }
        created_at: { type: string }
    CompetitionDetail:
      type: object
      description: 管理端竞赛详情（实体 + 计数统计）
      allOf:
        - $ref: '#/components/schemas/Competition'
        - type: object
          properties:
            stats:
              type: object
              properties:
                teams: { type: integer, description: 战队数 }
                participants: { type: integer, description: 参赛人数 }
                entered: { type: integer, description: 已入场人数 }
                challenges: { type: integer, description: 题目数 }
                instances: { type: integer, description: 竞赛容器数（全部状态） }
                warnings: { type: integer, description: 反作弊警告数 }
                writeups: { type: integer, description: 已提交 WP 人数 }
    CompetitionChallengeItem:
      type: object
      description: 竞赛题目条目（参赛者视角含描述与通关状态）
      properties:
        id: { type: integer, description: challenge_id }
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        score: { type: integer, description: 初始分值（竞赛内动态计分） }
        has_env: { type: boolean, description: 是否定义容器环境 }
        description_md: { type: string, description: 题目描述 Markdown（参赛者视角返回） }
        solved: { type: boolean, description: 当前用户（队内）是否已通关 }
        solve_count: { type: integer, description: 本题在竞赛内的通过人数（按积分派生行去重统计） }
    CompetitionScorePoint:
      type: object
      description: 得分曲线点（按通关时间升序，score 为累计得分）
      properties:
        at: { type: string, description: 通关时间（RFC3339） }
        challenge_id: { type: integer }
        delta: { type: integer, description: 本题得分 }
        score: { type: integer, description: 累计得分 }
    CompetitionCategoryStat:
      type: object
      description: 分类进度（分母为该分类绑定的题目数）
      properties:
        category: { type: string }
        total: { type: integer }
        solved: { type: integer }
        score_total: { type: integer, description: 该分类满分 }
        score_earned: { type: integer, description: 本人该分类已得分 }
    CompetitionDifficultyStat:
      type: object
      description: 难度进度（只返回该竞赛实际存在的难度，按入门/进阶/专家排序）
      properties:
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        total: { type: integer }
        solved: { type: integer }
    CompetitionSubmissionStats:
      type: object
      description: 本人提交结果计数（全量，不只最近 20 条）
      properties:
        correct: { type: integer }
        incorrect: { type: integer }
        pending: { type: integer }
    CompetitionAnalytics:
      type: object
      description: 竞赛首页看板聚合（只读派生数据，与排行榜同源）
      properties:
        score: { type: integer, description: 本人当前总分 }
        solved_count: { type: integer, description: 本人已通关题数 }
        total_challenges: { type: integer, description: 竞赛绑定题目数 }
        total_score: { type: integer, description: 全部题目初始分之和 }
        participant_count: { type: integer, description: 已入场参赛人数（通过率分母） }
        score_timeline:
          type: array
          items: { $ref: '#/components/schemas/CompetitionScorePoint' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CompetitionCategoryStat' }
        difficulties:
          type: array
          items: { $ref: '#/components/schemas/CompetitionDifficultyStat' }
        submission_stats: { $ref: '#/components/schemas/CompetitionSubmissionStats' }
    CompetitionParticipantItem:
      type: object
      description: 参赛人员条目（管理端；含队伍与入场状态）
      properties:
        id: { type: integer, description: participant_id }
        user_id: { type: integer }
        username: { type: string }
        team_id:
          type: integer
          nullable: true
          description: 所属战队（个人参赛为 null）
        team_name:
          type: string
          nullable: true
        invite_code: { type: string, description: 入场邀请码（管理员可重新分发） }
        entered: { type: boolean, description: 是否已入场 }
        entered_at:
          type: string
          nullable: true
        last_ip: { type: string, description: 最近提交来源 IP（反作弊 IP 异常检测基线） }
        created_at: { type: string }
    CheatWarningItem:
      type: object
      description: 反作弊警告（只在管理端展示：原因、人员、战队）
      properties:
        id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        team_id:
          type: integer
          nullable: true
        team_name:
          type: string
          nullable: true
        kind: { type: string, enum: [cross_team_flag, ip_anomaly], description: cross_team_flag=提交其他队伍 flag / ip_anomaly=来源 IP 异常 }
        reason: { type: string, description: 命中说明（含证据要素） }
        created_at: { type: string }
    WriteupItem:
      type: object
      description: WP 提交条目（管理端；单位 = 题目 × 队伍/个人）
      properties:
        id: { type: integer }
        challenge_id: { type: integer }
        challenge_title: { type: string }
        user_id: { type: integer, description: 最近一次提交/修改人（队伍模式为提交队员） }
        username: { type: string }
        team_name:
          type: string
          nullable: true
          description: null = 个人参赛者
        submitted_at: { type: string }
        content: { type: string, description: WP 正文 Markdown }
        zip_name: { type: string, description: 附带 zip 原文件名（未上传为空字符串） }
    MyWriteupItem:
      type: object
      description: 本队/本人某题的 WP（参赛端）
      properties:
        challenge_id: { type: integer }
        content_md: { type: string }
        zip_name: { type: string, description: 已上传 zip 原文件名（未上传为空字符串） }
        updated_at: { type: string }
        updated_by: { type: string, description: 最近一次提交/修改人用户名 }
    TeamLeaderboardEntry:
      type: object
      description: 战队排行榜条目（同分并列同名次）
      properties:
        rank: { type: integer }
        team_id: { type: integer }
        team_name: { type: string }
        score: { type: integer, description: 队内成员得分合计（事件派生） }
        bonus: { type: integer, description: 队内成员附加分合计 }
        solved_count: { type: integer, description: 队内成员通关题数 }
        members: { type: array, items: { type: string }, description: 成员用户名列表 }
        last_solve_at: { type: string, nullable: true, description: 最近一次通关时间（同分先达者靠前） }
        account_code: { type: string, description: 仅 individual 模式填充的账号编码（CSV 导出用） }
    CompLeaderboardEntry:
      type: object
      description: 竞赛个人排行榜条目（同分并列同名次）
      properties:
        rank: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        account_code: { type: string, description: 学号式账号编码 }
        team_name:
          type: string
          nullable: true
        score: { type: integer }
        bonus: { type: integer, description: 本人附加分合计 }
        solved_count: { type: integer }
        last_solve_at: { type: string, nullable: true, description: 最近一次通关时间（同分先达者靠前） }
    CtfAdjustment:
      type: object
      description: CTF 管理员附加分（append-only 源事实；排行榜总分 = 首通分 + 附加分）
      properties:
        id: { type: integer }
        competition_id: { type: integer }
        user_id: { type: integer }
        team_id: { type: integer, description: 0=个人参赛 }
        points: { type: integer, description: 可正可负；正向合计受 bonus_cap 限制 }
        reason: { type: string }
        created_by: { type: integer }
        created_at: { type: string }
        username: { type: string, description: 仅列表响应填充 }
        team_name: { type: string, nullable: true, description: 仅列表响应填充 }
    QualificationCandidate:
      type: object
      description: 晋级中选者（来源竞赛个人榜快照）
      properties:
        user_id: { type: integer }
        username: { type: string }
        account_code: { type: string }
        team_name: { type: string, nullable: true }
        rank: { type: integer }
        score: { type: integer }
    QualificationPreview:
      type: object
      description: 晋级预览（不落库；并列同名次在边界处一并入选，因此人数可超过 N）
      properties:
        source_competition_id: { type: integer }
        source_competition_name: { type: string }
        target_competition_id: { type: integer }
        target_competition_name: { type: string }
        mode: { type: string, enum: [min_score, top_n, top_percent] }
        threshold: { type: integer }
        total_participants: { type: integer }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/QualificationCandidate' }
    QualificationApplyResult:
      type: object
      properties:
        rule_id: { type: integer }
        imported: { type: integer, description: 导入/沿用为参赛者的人数 }
        missing: { type: array, items: { type: string }, description: 未匹配账号（理论上为空） }
        preview: { $ref: '#/components/schemas/QualificationPreview' }
    QualificationRule:
      type: object
      description: 已应用的晋级规则（来源→目标邀请赛）
      properties:
        id: { type: integer }
        source_competition_id: { type: integer }
        target_competition_id: { type: integer }
        mode: { type: string, enum: [min_score, top_n, top_percent] }
        threshold: { type: integer }
        created_by: { type: integer }
        created_at: { type: string }
        applied_at: { type: string, nullable: true }
