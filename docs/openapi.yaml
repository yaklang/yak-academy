                image: { type: string }
                ports: { type: array, items: { $ref: '#/components/schemas/AwdPort' } }
                checker_config: { type: object }
                base_score: { type: integer }
                sla_weight: { type: integer, minimum: 0, maximum: 100 }
                attack_points: { type: integer }
                defense_loss: { type: integer }
                checkdown_penalty: { type: integer }
                flag_lifetime_rounds: { type: integer, minimum: 1, maximum: 20 }
