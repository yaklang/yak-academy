            issued_count: { type: integer }
    CompetitionCertificate:
      type: object
      description: 证书快照（接收人/名次/分数签发时固定；code 为公开验证码）
      properties:
        id: { type: integer }
        rule_id: { type: integer }
        competition_id: { type: integer }
        recipient_kind: { type: string, enum: [user, team] }
        user_id: { type: integer }
        team_id: { type: integer }
        username: { type: string }
        recipient_name: { type: string }
        rank: { type: integer }
        score: { type: integer }
        level: { type: string }
        code: { type: string }
        created_at: { type: string }
    CertificateAdminView:
      type: object
      properties:
        competition_id: { type: integer }
        rules: { type: array, items: { $ref: '#/components/schemas/CertificateRuleSummary' } }
        certificates: { type: array, items: { $ref: '#/components/schemas/CompetitionCertificate' } }
        total: { type: integer }
    CertificateVerificationView:
      type: object
      description: 公开证书验证结果（不含账号 ID/用户名）
      properties:
        valid: { type: boolean }
        code: { type: string }
        title: { type: string }
        level: { type: string }
        competition_name: { type: string }
        recipient_name: { type: string }
        rank: { type: integer }
        score: { type: integer }
        issued_at: { type: string, nullable: true }
    CertificateIssueResult:
      type: object
      properties:
        rule: { $ref: '#/components/schemas/CertificateRule' }
        certificates: { type: array, items: { $ref: '#/components/schemas/CompetitionCertificate' } }
        preview: { $ref: '#/components/schemas/CertificatePreview' }
    ParticipantImportRequest:
      type: object
      description: |
        参赛人员与队伍批量导入（固定格式表格的 JSON 形态，前端由 CSV 解析而来）。
        成员条目按「账号编码或用户名」引用（先按账号编码精确匹配，再按用户名）；
        只导入已存在的账号——新建账号走一键生成（/generate-users）。
        缺失条目不阻断导入，在响应 missing 中回报。
      properties:
        teams:
          type: array
          items:
            type: object
            required: [name, members]
            properties:
              name: { type: string, description: 战队名（竞赛内唯一） }
              members: { type: array, items: { type: string }, description: 成员（账号编码或用户名） }
        individuals: { type: array, items: { type: string }, description: 个人参赛者（账号编码或用户名，不编队） }
    ParticipantImportResult:
      type: object
      description: 批量导入结果：全部参赛者邀请码与未匹配到的条目（导入只引用既有账号，新建走一键生成）
      properties:
        participants:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              account_code: { type: string }
              team_name: { type: string, nullable: true }
              invite_code: { type: string }
              mail_delivered: { type: boolean, description: 站内邀请邮件是否投递成功 }
        missing:
          type: array
          items: { type: string }
          description: 未匹配到账号的条目原文（账号编码或用户名均未命中）
    CompetitionProfileInput:
      type: object
      required: [real_name]
      properties:
        real_name: { type: string, maxLength: 64 }
        school: { type: string, maxLength: 128 }
        student_no: { type: string, maxLength: 64 }
        email: { type: string, maxLength: 128 }
        phone: { type: string, maxLength: 32 }
    CompetitionProfileView:
      type: object
      description: 竞赛身份名册（未填写时 has_profile=false，仍返回账号信息）
      properties:
        competition_id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        account_code: { type: string }
        has_profile: { type: boolean }
        real_name: { type: string }
        school: { type: string }
        student_no: { type: string }
        email: { type: string }
        phone: { type: string }
        updated_at: { type: string, nullable: true }
    CompetitionRosterRow:
      allOf:
        - $ref: '#/components/schemas/CompetitionProfileView'
        - type: object
          properties:
            team_name: { type: string, nullable: true }
            entered: { type: boolean }
    CompetitionRosterEntry:
      type: object
      required: [entry, real_name]
      properties:
        entry: { type: string, description: 账号编码或用户名（引用既有账号；缺失在 missing 回报） }
        real_name: { type: string, maxLength: 64 }
        school: { type: string, maxLength: 128 }
        student_no: { type: string, maxLength: 64 }
        email: { type: string, maxLength: 128 }
        phone: { type: string, maxLength: 32 }
    CompetitionRosterImportRequest:
      type: object
      required: [entries]
      properties:
        entries: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/CompetitionRosterEntry' } }
    CompetitionRosterImportResult:
      type: object
      properties:
        imported: { type: integer }
        profiles:
          type: array
          items: { $ref: '#/components/schemas/CompetitionProfileView' }
        participants:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              account_code: { type: string }
              team_name: { type: string, nullable: true }
              invite_code: { type: string }
              mail_delivered: { type: boolean }
        missing: { type: array, items: { type: string }, description: 未匹配到账号的条目原文 }
    GenerateUsersRequest:
      type: object
      required: [prefix, count]
      properties:
        prefix: { type: string, description: "生成用户名前缀（小写字母/数字/连字符，1-16 位；用户名 = 前缀-零填充序号，如 class26-01）" }
        count: { type: integer, minimum: 1, maximum: 500, description: 生成数量 }
        team_size: { type: integer, minimum: 0, maximum: 10, default: 0, description: 自动组队人数（0=全部个人参赛；>0 按人数依次编入「第 n 队」，余数进最后一队） }
        password: { type: string, default: "123456", description: 新建账号初始密码（默认 123456，仅新建账号使用；已存在账号沿用原密码） }
    GenerateUsersResult:
      type: object
      description: 一键生成结果：账号清单（含初始密码，供导出分发）与参赛/组队/邀请码
      properties:
        accounts:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              account_code: { type: string }
              initial_password: { type: string, nullable: true, description: 新建账号的初始密码（本次请求指定；已存在账号为 null，沿用原密码） }
              created: { type: boolean, description: 本次是否新建（false=复用既有账号） }
        teams:
          type: array
          items: { type: string }
          description: 自动创建的队伍名（第 n 队；team_size=0 为空）
        participants:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              account_code: { type: string }
              team_name: { type: string, nullable: true }
              invite_code: { type: string }
    PublicCompetitionItem:
      type: object
      description: 竞赛广场条目（仅公开赛；邀请赛不对外展示）
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        format: { type: string, enum: [ctf, awd, exam], description: 竞赛形式（创建后不可更改） }
        scoring_mode: { type: string, enum: [dynamic, fixed], description: 仅 CTF 生效的计分模式 }
        registration_start: { type: string, format: date-time, nullable: true, description: 报名开始时间（可选） }
        registration_end: { type: string, format: date-time, nullable: true, description: 报名截止时间（可选，不得晚于 end_time） }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, running, ended] }
        registered: { type: boolean, description: 当前用户是否已报名 }
        participants: { type: integer, description: 已报名人数 }
    MyCompetitionEntry:
      type: object
      description: 当前用户参赛/锁定状态（前端路由守卫用）
      properties:
        competition:
          allOf:
            - $ref: '#/components/schemas/Competition'
          nullable: true
          description: 已入场的进行中竞赛（null = 未入场）
        locked: { type: boolean, description: true = 已入场且邀请赛未结束，平台其余入口锁定；公开赛不锁、管理员恒为 false }
        entered: { type: boolean, description: 是否已入场（该竞赛） }
        team_name:
          type: string
          nullable: true
          description: 所属战队（个人参赛为 null）
    AwdPort:
      type: object
      required: [name, port]
      properties:
        name: { type: string }
        port: { type: integer }
        protocol: { type: string, enum: [tcp, udp], default: tcp }
    AwdService:
      type: object
