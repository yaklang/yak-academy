      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, start_time, end_time]
              properties:
                name: { type: string, minLength: 1 }
                description: { type: string }
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}:
    get:
      tags: [admin]
      summary: 竞赛详情（含 teams/participants/entered/challenges/instances/warnings/writeups 计数）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionDetail' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    patch:
      tags: [admin]
      summary: |
        修改竞赛配置（name/description/起止时间；至少一项）。
        running 期间 start_time 不可改（入场锁定语义依赖开赛时刻）、
        end_time 可延后或缩短；已结束的竞赛起止时间均可重新配置
        （新窗口落回未来即重新开赛）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                description: { type: string }
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionDetail' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }
    delete:
      tags: [admin]
      summary: |
        删除竞赛（仅 scheduled/ended 可删，running 期间 422 拒绝——先手动结束）。
        级联清理：参赛者/队伍/题目绑定/反作弊警告/WP（含落盘 zip）/竞赛积分/
        竞赛内提交与容器记录；运行中容器先销毁。提交事件历史 append-only 保留。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/end:
    post:
      tags: [admin]
      summary: |
        手动结束竞赛（仅 running；end_time 置为当前时刻，状态仍由时间派生）。
        scheduled/ended 状态调用 422。已结束的竞赛可通过 PATCH 重新配置起止时间。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionDetail' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/challenges:
    get:
      tags: [admin]
      summary: 竞赛题目列表
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TrainingItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: |
        竞赛题目绑定：批量导入题目 JSON（数组，challenge.json 格式，
        单题失败整体拒绝）或绑定既有题目 slug。单题上传与批量导入统一走本接口。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/ChallengeJSON' }
                - type: array
                  items: { $ref: '#/components/schemas/ChallengeJSON' }
                - type: object
                  required: [slugs]
                  properties:
                    slugs: { type: array, items: { type: string }, description: 绑定既有题目的 slug 列表 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer, description: 本次新增绑定的题目数 }
                  items: { type: array, items: { $ref: '#/components/schemas/TrainingItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }
    delete:
      tags: [admin]
      summary: 解绑题目（body 传 slugs；运行中的竞赛不允许）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slugs]
              properties:
                slugs: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/participants:
    get:
      tags: [admin]
      summary: 参赛人员与队伍（分页：队伍富化进条目，含入场状态与最近提交 IP）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      teams: { type: array, items: { $ref: '#/components/schemas/TeamLeaderboardEntry' }, description: 队伍总览（含成员名） }
                      items: { type: array, items: { $ref: '#/components/schemas/CompetitionParticipantItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 参赛人员与队伍批量导入（用户不存在自动创建；邀请邮件投递到站内邮箱）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantImportRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantImportResult' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/instances:
    get:
      tags: [admin]
      summary: 本竞赛容器实例（该竞赛全部题目，分页；竞赛容器管理独立）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminLabInstance' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/warnings:
    get:
      tags: [admin]
      summary: 反作弊警告列表（原因/人员/战队；只在管理端展示）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CheatWarningItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/writeups:
    get:
      tags: [admin]
      summary: WP 提交情况（按题目一份；队伍模式全队共享，管理端按队伍/个人聚合查看）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WriteupItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/writeups/{wid}/zip:
    get:
      tags: [admin]
      summary: 下载某份 WP 的附带 zip（multipart 上传的原包）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: wid, in: path, required: true, schema: { type: integer, description: WP 条目 id } }
      responses:
        '200':
          description: zip 文件流
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/leaderboard:
    get:
      tags: [admin]
      summary: 竞赛排行榜（管理端可见；mode=team 按战队 / mode=individual 按个人）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: mode, in: query, schema: { type: string, enum: [team, individual], default: team } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [team, individual] }
                  items: { type: array, items: { $ref: '#/components/schemas/TeamLeaderboardEntry' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /competitions/me:
    get:
      tags: [competitions]
      summary: 当前用户参赛状态（已入场未结束 → locked=true，前端据此锁定平台入口）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyCompetitionEntry' }

  /competitions/{id}/enter:
    post:
      tags: [competitions]
      summary: 竞赛入场（站内邀请邮件携带邀请码；成功后锁定至比赛结束）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyCompetitionEntry' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/view:
    get:
      tags: [competitions]
      summary: 竞赛首页（参赛者视角：题目列表、我的队伍、我的提交、倒计时）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  competition: { $ref: '#/components/schemas/Competition' }
                  team_name: { type: string, nullable: true }
                  teammates: { type: array, items: { type: string } }
                  challenges: { type: array, items: { $ref: '#/components/schemas/CompetitionChallengeItem' } }
                  my_submissions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        status: { type: string, enum: [pending, correct, incorrect] }
                        score: { type: integer }
                        created_at: { type: string }
                  writeup_submitted: { type: boolean, description: 是否已提交任一题 WP（结束后；队伍模式任一队员提交即为 true） }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/challenges/{slug}/instance:
    post:
      tags: [competitions]
      summary: 启动竞赛题目容器（单容器约束：仅限本竞赛题目）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabInstance' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '409':
          description: 单容器冲突（同时只允许一个活跃容器）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/submissions:
    post:
      tags: [competitions]
      summary: 竞赛内提交 flag（异步判定；提交其他队伍 flag 触发反作弊警告）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_slug, answer]
              properties:
                challenge_slug: { type: string }
                answer: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/leaderboard:
    get:
      tags: [competitions]
      summary: 竞赛排行榜（参赛者可见；mode=team / individual）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: mode, in: query, schema: { type: string, enum: [team, individual], default: team } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [team, individual] }
                  items: { type: array, items: { $ref: '#/components/schemas/TeamLeaderboardEntry' } }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/writeups:
    get:
      tags: [competitions]
      summary: 本队/本人全部 WP（比赛结束后；按题目一份，队伍模式任一队员可读改）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MyWriteupItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/writeups/{challengeId}:
    put:
      tags: [competitions]
      summary: 提交/修改某题 WP 文字（比赛结束后；队伍模式全队共享一份，可反复修改）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: challengeId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_md]
              properties:
                # 空串 = 仅保留已上传 zip、清空文字；文字与 zip 至少一项存在（否则 422）。
                content_md: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/writeups/{challengeId}/zip:
    post:
      tags: [competitions]
      summary: 上传/替换某题 WP 附带 zip（脚本与截图打包，≤20MB，需为合法 zip；覆盖旧包）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: challengeId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  zip_name: { type: string, description: 保存的原文件名 }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }
