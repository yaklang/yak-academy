                  top: { type: array, items: { $ref: '#/components/schemas/LeaderboardEntry' }, description: 全场前三（任意页都返回，供领奖台展示） }
                  me:
                    allOf:
                      - $ref: '#/components/schemas/LeaderboardEntry'
                    nullable: true
                    description: 当前用户排名（未上榜为 null；不受分页限制）
                  stats: { $ref: '#/components/schemas/LeaderboardStats' }
                  distribution: { type: array, items: { $ref: '#/components/schemas/ScoreDistributionBand' }, description: 积分分布（按榜首积分动态分档，负分单独一档） }

  /badges:
    get:
      tags: [student]
      summary: 徽章列表（含当前用户获得状态；徽章是积分/进度派生数据的计算型读模型，不落库）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Badge' }

  /content/packages:
