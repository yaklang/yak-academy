              schema: { $ref: '#/components/schemas/ExamAnswerView' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/exam/attempts/current/submit:
    post:
      tags: [competitions]
      summary: 交卷（客观题即时评分；已到期按 expired 自动交卷；幂等）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamParticipantView' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/exam/attempts/current/questions/{qid}/code:
    post:
      tags: [competitions]
      summary: 提交编程题源码（judge exam scope；异步判定后回写考试分）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: qid, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamCodeInput' }
      responses:
        '202':
          description: Accepted（入队判定）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamCodeSubmissionView' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/awd/attacks:
    post:
      tags: [competitions]
      summary: AWD 提交 flag（入队异步判定；业务拒绝返回 200 + accepted=false）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flag]
              properties:
                flag: { type: string }
      responses:
        '200':
          description: 业务拒绝（flag 不存在/过期/自攻/已被首杀）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AwdAttackReceipt' }
        '202':
          description: 已入队（pending，worker 异步判定）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AwdAttackReceipt' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/leaderboard:
    get:
      tags: [competitions]
      summary: 竞赛排行榜（参赛者可见；mode=team / individual）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: mode, in: query, schema: { type: string, enum: [team, individual], default: team } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [team, individual] }
                  items: { type: array, items: { $ref: '#/components/schemas/TeamLeaderboardEntry' } }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/writeups:
    get:
      tags: [competitions]
      summary: 本队/本人全部 WP（比赛结束后；按题目一份，队伍模式任一队员可读改）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MyWriteupItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/writeups/{challengeId}:
    put:
      tags: [competitions]
      summary: 提交/修改某题 WP 文字（比赛结束后；队伍模式全队共享一份，可反复修改）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: challengeId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_md]
              properties:
                # 空串 = 仅保留已上传 zip、清空文字；文字与 zip 至少一项存在（否则 422）。
                content_md: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/writeups/{challengeId}/zip:
    post:
      tags: [competitions]
      summary: 上传/替换某题 WP 附带 zip（脚本与截图打包，≤20MB，需为合法 zip；覆盖旧包）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: challengeId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  zip_name: { type: string, description: 保存的原文件名 }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }
