      summary: 全部 Lab 容器实例（分页，含用户/题目富化）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminLabInstance' } }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /admin/lab-instances/active:
    get:
      tags: [admin]
      summary: 当前活跃容器（creating/running，管理端概览卡片）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminLabInstance' } }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /admin/lab-instances/logs:
    get:
      tags: [admin]
      summary: 容器实例生命周期日志（started/stopped，分页，管理端日志表格）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/InstanceLog' } }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /admin/lab-instances/{id}:
    delete:
      tags: [admin]
      summary: 强制销毁实例（写 lab.instance.stopped 事件，payload source=admin）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /admin/users:
    get:
      tags: [admin]
      summary: 用户列表（分页 + 过滤/搜索：关键字/角色/活跃度/从未完成题目）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: q, in: query, schema: { type: string }, description: 关键字（用户名/账号编码/邮箱/手机号模糊匹配） }
        - { name: role, in: query, schema: { type: string, enum: [student, admin] } }
        - { name: active, in: query, schema: { type: string, enum: [true, false] }, description: 活跃过滤：false=仅不活跃（最近登录或注册距今超 6 个月） }
        - { name: no_solves, in: query, schema: { type: string, enum: [true, false] }, description: true=仅从未完成过题目的用户（不存在判定通过的提交） }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminUserItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LoginRequest'
                - type: object
                  properties:
                    global_role: { type: string, enum: [student, admin], default: student, description: student=普通人，admin=管理员 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /admin/users/{id}/roles:
    patch:
      tags: [admin]
      summary: 修改全局角色（student=普通人 / admin=管理员）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                global_role: { type: string, enum: [student, admin], description: student=普通人，admin=管理员 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /admin/users/{id}/reset-password:
    post:
      tags: [admin]
      summary: 重置用户密码（使该用户全部已签发 token 失效）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/backups:
    get:
      tags: [admin]
      summary: 备份归档列表（新→旧，受保留份数约束；ops 硬化）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BackupInfo' }
        '403': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: >
        立即生成一份备份：SQLite 一致性快照（VACUUM INTO）+ attachments/avatars/
        writeups 数据目录打包为单文件 tar.gz，超出保留份数自动清理。
        PostgreSQL 模式（ACADEMY_DB_DSN）不支持应用内备份，返回 422（数据库走外部 pg_dump）
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/backups/{name}:
    get:
      tags: [admin]
      summary: 下载备份归档（application/gzip；离机保存/异地容灾）
      parameters:
        - { name: name, in: path, required: true, schema: { type: string }, description: 归档文件名（academy-YYYYMMDD-HHMMSS.tar.gz） }
      responses:
        '200':
          description: OK
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /admin/settings/smtp:
    get:
      tags: [admin]
      summary: 读取邮件服务配置（统一管理；密码只返回是否已保存，永不回显）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSMTPSettings' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }
    put:
      tags: [admin]
      summary: >
        保存邮件服务配置并立即热加载（无需重启）。配置落 system_settings 表，
        保存后优先于环境变量；密码使用 AES-256-GCM 加密存储，响应不回显。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSMTPSettingsUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSMTPSettings' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /admin/settings/smtp/test:
    post:
      tags: [admin]
      summary: 使用当前已保存配置发送测试邮件（管理员自检 SMTP 投递链路）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSMTPTestRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /admin/audit-logs:
    get:
      tags: [admin]
      summary: 管理操作审计分页查询（新→旧；可按动作/管理员过滤；ops 硬化）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: action, in: query, schema: { type: string }, description: 动作过滤（如 content.publish、user.roles） }
        - { name: admin_id, in: query, schema: { type: integer }, description: 管理员用户 ID 过滤 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminAuditLog' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/performance:
    get:
      tags: [admin]
      summary: >
        主机/容器性能快照（容器管理页性能面板；ops 硬化）：docker info 宿主
        概览 + docker stats 全容器资源占用 + Linux /proc 宿主 CPU/内存采样 +
        数据卷 statfs 用量。容器运行时未配置（无 docker）返回 501
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceReport' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '501': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions:
    get:
      tags: [admin]
      summary: 竞赛列表（分页，含派生状态 scheduled/running/ended）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Competition' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 创建竞赛（name/起止时间/类型；描述可选）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, start_time, end_time]
              properties:
                name: { type: string, minLength: 1 }
                kind: { type: string, enum: [public, invitational], default: invitational, description: public=公开赛（广场展示+自助报名）/ invitational=邀请赛（定向导入+邀请码入场）；创建后不可更改 }
                format: { type: string, enum: [ctf, awd, exam], default: ctf, description: 竞赛形式；创建后不可更改 }
                scoring_mode: { type: string, enum: [dynamic, fixed], default: dynamic, description: 仅 CTF 形式生效；fixed=按题目分值固定计分 }
                bonus_cap: { type: integer, minimum: 0, description: CTF 单人正向附加分上限（0=不限） }
                registration_start: { type: string, format: date-time, nullable: true, description: 报名开始时间（与 registration_end 成对配置） }
                registration_end: { type: string, format: date-time, nullable: true, description: 报名截止时间（不得晚于 end_time） }
                description: { type: string }
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}:
    get:
      tags: [admin]
      summary: 竞赛详情（含 teams/participants/entered/challenges/instances/warnings/writeups 计数）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionDetail' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    patch:
      tags: [admin]
      summary: |
        修改竞赛配置（name/description/起止时间/计分模式/报名窗口；至少一项）。
        running 期间 start_time 不可改（入场锁定语义依赖开赛时刻）、
        end_time 可延后或缩短；已结束的竞赛起止时间均可重新配置
        （新窗口落回未来即重新开赛）。scoring_mode 仅 CTF 且仅开赛前可切换；
        报名窗口须与竞赛 end_time 一致（不得晚于结束）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                description: { type: string }
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
                scoring_mode: { type: string, enum: [dynamic, fixed], description: 仅 CTF 且仅 scheduled 可切换 }
                bonus_cap: { type: integer, minimum: 0, description: 仅 CTF；调整当日即生效，0=不限 }
                registration_start: { type: string, format: date-time, nullable: true }
                registration_end: { type: string, format: date-time, nullable: true }
                clear_registration: { type: boolean, description: 清空报名窗口（与设置字段互斥） }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionDetail' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }
    delete:
      tags: [admin]
      summary: |
        删除竞赛（仅 scheduled/ended 可删，running 期间 422 拒绝——先手动结束）。
        级联清理：参赛者/队伍/题目绑定/反作弊警告/WP（含落盘 zip）/竞赛积分/
        竞赛内提交与容器记录；运行中容器先销毁。提交事件历史 append-only 保留。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/end:
    post:
      tags: [admin]
      summary: |
        手动结束竞赛（仅 running；end_time 置为当前时刻，状态仍由时间派生）。
        scheduled/ended 状态调用 422。已结束的竞赛可通过 PATCH 重新配置起止时间。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionDetail' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/challenges:
    get:
      tags: [admin]
      summary: 竞赛题目列表
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TrainingItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: |
        竞赛题目绑定：批量导入题目 JSON（数组，challenge.json 格式，
        单题失败整体拒绝）或绑定既有题目 slug。单题上传与批量导入统一走本接口。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/ChallengeJSON' }
                - type: array
                  items: { $ref: '#/components/schemas/ChallengeJSON' }
                - type: object
                  required: [slugs]
                  properties:
                    slugs: { type: array, items: { type: string }, description: 绑定既有题目的 slug 列表 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer, description: 本次新增绑定的题目数 }
                  items: { type: array, items: { $ref: '#/components/schemas/TrainingItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }
    delete:
      tags: [admin]
      summary: 解绑题目（body 传 slugs；运行中的竞赛不允许）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slugs]
              properties:
                slugs: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/participants:
    get:
      tags: [admin]
      summary: 参赛人员与队伍（分页：队伍富化进条目，含入场状态与最近提交 IP）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      teams: { type: array, items: { $ref: '#/components/schemas/TeamLeaderboardEntry' }, description: 队伍总览（含成员名） }
                      items: { type: array, items: { $ref: '#/components/schemas/CompetitionParticipantItem' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 参赛人员与队伍批量导入（用户不存在自动创建；邀请邮件投递到站内邮箱）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantImportRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantImportResult' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/generate-users:
    post:
      tags: [admin]
      summary: 邀请赛一键生成参赛新用户（可配置自动组队；结果含初始密码供导出分发）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateUsersRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateUsersResult' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/competitions/{id}/roster:
    get:
      tags: [admin]
      summary: 身份名册（全部参赛者；未填写名册的 has_profile=false）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/CompetitionRosterRow' } }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
