      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyCompetitionEntry' }

  /competitions/{id}/enter:
    post:
      tags: [competitions]
      summary: 竞赛入场（邀请赛凭站内邀请邮件的邀请码入场并锁定至结束；公开赛已报名用户免码进入、可自由进出）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                invite_code: { type: string, description: 邀请码（邀请赛必填；公开赛已报名用户可省略） }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyCompetitionEntry' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /competitions/{id}/entry:
    get:
      tags: [competitions]
      summary: 竞赛入口元数据（格式无关；前端按 format 分发 CTF/AWD/Exam）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  competition: { $ref: '#/components/schemas/Competition' }
                  team_name: { type: string, nullable: true }
        '404': { $ref: '#/components/responses/ErrorResp' }

