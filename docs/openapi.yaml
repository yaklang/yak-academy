openapi: 3.0.3
info:
  title: yak-academy API
  version: 0.1.0
  description: |
    yak-academy 安全实训平台 API 契约（唯一契约源）。
    规则：改接口必须先改本文件，再改后端 handler，再改前端 src/api/。
    统一错误信封：{"error":{"code","message"}}。
    第一版所有接口允许 stub 返回 501，但路由必须注册。
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: auth
  - name: student
  - name: admin
  - name: env
  - name: public
  - name: competitions

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, CONFLICT, INTERNAL]
            message: { type: string }
    YakEngineStatus:
      type: object
      required: [configured, path, version, download]
      properties:
        configured: { type: boolean, description: 引擎已装配（code 判定与自测运行可用） }
        path: { type: string, description: 当前引擎路径；未装配时为下载目标路径 }
        version: { type: string, description: 已知引擎版本（下载完成时解析；未知为空） }
        download:
          type: object
          required: [state, received, total]
          properties:
            state: { type: string, enum: [idle, running, done, failed] }
            received: { type: integer, description: 已接收字节数 }
            total: { type: integer, description: 总字节数（Content-Length；未知为 -1） }
            error: { type: string, description: 失败原因（state=failed 时） }
    Page:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    BackupInfo:
      type: object
      required: [name, size_bytes, created_at, database, store_kinds]
      properties:
        name: { type: string, description: 归档文件名（academy-YYYYMMDD-HHMMSS.tar.gz） }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
        database: { type: string, description: 数据库模式（sqlite；归档内含一致性快照） }
        store_kinds: { type: string, description: WP 附件存储后端（fs/s3；s3 时 WP zip 不在归档内） }
    AdminAuditLog:
      type: object
      description: 管理操作审计行（append-only；与 Event 学生行为流分工，不参与事件重放）
      properties:
        id: { type: integer }
        admin_id: { type: integer }
        admin_name: { type: string }
        action: { type: string, description: 动作（如 content.publish、user.roles、competition.create） }
        target_type: { type: string, description: 目标类型（package/challenge/user/competition/backup/…） }
        target_id: { type: string, description: 目标标识（ID/slug/文件名等） }
        detail: { type: object, nullable: true, description: 动作附加详情（JSON；无则为 null） }
        ip: { type: string, description: 来源地址（剥端口后的 host） }
        created_at: { type: string, format: date-time }
    PerformanceReport:
      type: object
      description: 主机/容器性能快照（docker info/stats + Linux /proc + statfs；不可用字段为 null）
      properties:
        ncpu: { type: integer, description: 宿主 CPU 核数（docker info） }
        mem_total_bytes: { type: integer, description: 宿主内存总量（docker info） }
        containers_total: { type: integer }
        containers_running: { type: integer }
        containers_paused: { type: integer }
        containers_stopped: { type: integer }
        images: { type: integer }
        host:
          type: object
          nullable: true
          properties:
            cpu_percent: { type: number, nullable: true, description: 宿主 CPU 占用率（/proc/stat 两次采样；非 Linux 为 null） }
            mem_total_bytes: { type: integer }
            mem_used_bytes: { type: integer, nullable: true, description: 宿主已用内存（/proc/meminfo；非 Linux 为 null） }
        data_volume:
          type: object
          nullable: true
          properties:
            path: { type: string }
            total_bytes: { type: integer }
            used_bytes: { type: integer }
            avail_bytes: { type: integer }
        containers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              cpu_percent: { type: number }
              mem_used_bytes: { type: integer }
              mem_limit_bytes: { type: integer }
              mem_percent: { type: number }
              net_io_bytes:
                type: array
                items: { type: integer, nullable: true }
                description: "[收, 发]；解析失败为 null 元素"
              block_io_bytes:
                type: array
                items: { type: integer, nullable: true }
                description: "[读, 写]；解析失败为 null 元素"
              pids: { type: integer }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        global_role: { type: string, enum: [student, admin], description: student=普通人，admin=管理员 }
    UserProfile:
      type: object
      description: 账号信息面板（本人视角）：内置账号 ID、账号名称、简介、总得分、头像。
      properties:
        id: { type: integer, description: 内置账号 ID }
        username: { type: string, description: 账号名称 }
        global_role: { type: string, enum: [student, admin] }
        bio: { type: string, description: 描述简介（≤500 字，可空） }
        score: { type: integer, description: 总得分（事件派生数据，只读） }
        solve_count: { type: integer, description: 解题数（事件派生数据，只读） }
        avatar: { type: string, nullable: true, description: 头像 URL（未上传为 null） }
        created_at: { type: string, description: 注册时间（RFC3339） }
    MailItem:
      type: object
      description: 站内邮件（只收不发）：竞赛邀请等系统通知。
      properties:
        id: { type: integer }
        title: { type: string }
        body_md: { type: string, description: 正文 Markdown }
        kind: { type: string, enum: [invite], description: invite=竞赛邀请（附邀请码） }
        competition_id: { type: integer, nullable: true, description: 竞赛邀请关联的竞赛 ID }
        invite_code: { type: string, nullable: true, description: 竞赛邀请码（kind=invite 时必有） }
        read: { type: boolean, description: 是否已读 }
        created_at: { type: string, description: RFC3339 }
    Topic:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        room_count: { type: integer }
    Room:
      type: object
      properties:
        slug: { type: string }
        topic_slug: { type: string }
        title: { type: string }
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        lesson_md: { type: string, description: 教程正文 Markdown }
        video_url: { type: string, description: 视频教程地址（可选，lesson.md front matter video 字段） }
        related_challenge_slug:
          type: string
          nullable: true
          description: 关联题目 slug（题目 tutorial_slug 指向本 Room 时返回，可空）
    SubmissionRequest:
      type: object
      required: [challenge_slug, answer]
      properties:
        challenge_slug: { type: string }
        answer: { type: string, description: "flag 判定题：flag 文本；ACM 编程题：yak 源码全文（判定不用 flag）" }
    Submission:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, correct, incorrect] }
        score: { type: integer, description: 判定得分（ACM 部分得分制：全过 = 题面全额；部分通过组按组分值权重折算） }
        verdict:
          type: string
          nullable: true
          enum: [ac, wa, tle, re, internal_error]
          description: |
            ACM 编程题判定结果（flag 判定题为 null）：ac=全部数据通过；wa=输出不匹配；
            tle=超时；re=运行出错/内存超限；internal_error=引擎不可用等平台侧失败
            （不消耗题目的判定机会，可稍后重试）。
        groups:
          type: array
          nullable: true
          description: |
            ACM 编程题逐组判定明细（部分得分制；flag 判定题为 null）。判定对全部
            数据组逐组运行（非首败即停），每组独立结论；通过组的分值权重折算进 score。
            样例组（sample=true）学生可见名称，隐藏组仅展示序号名。
          items:
            type: object
            properties:
              name: { type: string }
              sample: { type: boolean }
              passed: { type: boolean }
              verdict: { type: string, enum: [wa, tle, re], description: 失败组的判定 }
              score: { type: integer, description: 组配置分值（0 = 未配置，按权重均分语义不适用） }
    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer, description: 并列同分同名次（count-based，跨页一致） }
        username: { type: string }
        score: { type: integer }
        solved_count: { type: integer }
    Badge:
      type: object
      properties:
        code: { type: string, description: 徽章唯一码（如 first_solve） }
        title: { type: string }
        description: { type: string, description: 获得条件说明 }
        earned: { type: boolean, description: 当前用户是否已获得 }
    ContentPackage:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        latest_version: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        error: { type: string, description: 管线失败原因 }
    ContentVersion:
      type: object
      properties:
        id: { type: integer }
        version: { type: string, description: 语义化版本号 }
        status: { type: string, enum: [draft, published, archived] }
        checksum: { type: string, description: zip sha256 }
        created_at: { type: string, format: date-time }
    LabInstance:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [creating, running, stopped, destroyed] }
        endpoint: { type: string, description: 实例访问地址（http://<主机>:<随机宿主端口>；主机由 ACADEMY_INSTANCE_PUBLIC_HOST 决定，默认 127.0.0.1 仅宿主本机可达，服务器部署设学员可达的宿主地址） }
        expire_at: { type: string, description: TTL 过期时间（RFC3339，UTC） }
        extend_count: { type: integer, description: 已续期次数（上限 2，达到后续期 422） }
        created_at: { type: string }
    InstanceConflict:
      type: object
      description: 单用户并发上限冲突（同时只允许一个活跃容器）
      properties:
        current: { $ref: '#/components/schemas/AdminLabInstance', description: 当前活跃实例（含题目信息，前端引导关闭） }
    InstanceLog:
      type: object
      description: 容器实例生命周期日志条目（append-only）
      properties:
        id: { type: integer }
        instance_id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        challenge_id: { type: integer }
        challenge_title: { type: string }
        challenge_slug: { type: string }
        action: { type: string, enum: [started, stopped], description: 生命周期动作 }
        source: { type: string, description: 触发来源（owner/admin/reaper） }
        status: { type: string, enum: [creating, running, stopped, destroyed], description: 动作时的实例状态 }
        detail: { type: string, description: 失败原因/补充信息（如 "ttl expired"） }
        created_at: { type: string }
    TrainingItem:
      type: object
      description: 题库题目条目（独立 Challenge 资源，页内按 bank 分 tab、category 分组展示）
      properties:
        id: { type: integer, description: challenge_id }
        slug: { type: string }
        title: { type: string }
        category: { type: string, description: 分类 slug（题库页分组键） }
        bank:
          type: string
          enum: [tutorial, ctf, acm]
          description: 题库 tab（tutorial=教程题目，专属内置题集，仅一键导入写入；ctf=CTF 题目，上传缺省；acm=ACM 题目）
        is_builtin: { type: boolean, description: 是否来自官方内置训练题集（一键导入标记；普通上传不改动） }
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        score: { type: integer }
        solved: { type: boolean, description: 当前用户是否已通关 }
        has_env: { type: boolean, description: 是否定义容器环境 }
        is_visible: { type: boolean, description: 可见性开关（false 学生端整体隐藏；仅管理端列表返回，学生端恒为 true） }
        release_at:
          type: string
          nullable: true
          description: 定时发布时间（RFC3339；到期前学生端隐藏。null = 立即发布语义，仅受 is_visible 约束）
        links:
          type: array
          description: 题目外链（配套工具/参考资料）
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
        tutorial_slug:
          type: string
          nullable: true
          description: 关联教程 Room slug（可选）
        tutorial_title:
          type: string
          nullable: true
          description: 关联教程 Room 标题
        tutorial_topic_slug:
          type: string
          nullable: true
          description: 关联教程所属 topic slug（前端跳转 Room 详情路由用）
    ChallengeDetail:
      type: object
      description: 题目详情（训练场点入页）
      allOf:
        - $ref: '#/components/schemas/TrainingItem'
        - type: object
          properties:
            description_md: { type: string, description: 题目描述 Markdown（背景/任务目标） }
            judge:
              type: object
              nullable: true
              description: |
                ACM 编程题判定配置（flag 判定题为 null）：学生提交 yak 源码，
                worker 对每组测试数据运行比对（sample=true 的组是样例，其余隐藏）。
                测试数据内容不下发——样例经 /challenges/{slug}/judge/samples 端点提供。
              properties:
                engine: { type: string, enum: [yak] }
                time_limit_s: { type: integer, description: 单组数据时限（秒） }
                memory_limit_mb: { type: integer, description: 单组数据内存上限（MB） }
                testdata_count: { type: integer, description: 测试数据组数（含样例） }
                allowed_libs:
                  type: array
                  nullable: true
                  description: |
                    题目级 yak 库白名单（judge.allowed_libs 配置；null = 未配置，
                    允许全部非黑名单库）。服务端已扣除全局黑名单；编辑器补全与
                    提交/自测拦截均以此为准。
                  items: { type: string }
                blocked_libs:
                  type: array
                  description: 平台全局 yak 库黑名单（exec/cli/file 等高危库；env ACADEMY_YAK_LIB_BLACKLIST 可覆盖）——任何题目不可使用。
                  items: { type: string }
                engine_available:
                  type: boolean
                  description: |
                    判定引擎是否已装配（ACADEMY_YAK_BIN 配置或管理端下载）。
                    false 时前端禁用提交/自测入口并提示联系管理员，代替点击后才
                    收到 internal_error / 422 的滞后反馈。
            hints:
              type: array
              items: { $ref: '#/components/schemas/HintView' }
            attachments:
              type: array
              description: 题目附件列表（学生端凭 JWT 经 /challenges/{slug}/attachments/{filename} 下载）
              items: { $ref: '#/components/schemas/ChallengeAttachment' }
    HintView:
      type: object
      description: 提示视图。未解锁时 content 为空字符串；解锁后返回正文。
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string, description: 未解锁时为空 }
        cost: { type: integer, description: 解锁扣减积分（0 = 免费仍需点解锁） }
        unlocked: { type: boolean }
    HintUnlockResponse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        cost: { type: integer }
        unlocked: { type: boolean, enum: [true] }
        score: { type: integer, description: 解锁后的当前积分 }
    ChallengeJSON:
      type: object
      description: |
        题目定义 JSON（兼容批量导入的固定格式，单对象或对象数组）。
        带容器环境的题目推荐改用 challenge 包 zip（challenge.yml + Dockerfile + docker-compose.yml）。
      required: [slug, title, category, difficulty, score]
      properties:
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        bank:
          type: string
          enum: [ctf, acm]
          default: ctf
          description: |
            题库 tab。上传路径仅可选 ctf / acm（传 tutorial 一律 422——教程题目 tab
            专属官方内置题集，仅 POST /admin/challenges/builtin 一键导入写入）。
            缺省：新建题默认 ctf；重传已有题保留原值。
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        description_md: { type: string }
        score: { type: integer }
        flag_mode:
          type: string
          enum: [shared, instance]
          default: shared
          description: "shared=题目级共享 flag；instance=每容器实例唯一（模板含 {token}，须有 env）"
        challenge:
          type: object
          required: [type, flag]
          description: |
            flag 判定定义（static/regex）。ACM 编程题（judge 段存在）不判定 flag，
            challenge 段整体省略；否则必填。
          properties:
            type: { type: string, enum: [static, regex] }
            flag: { type: string, description: "instance 模式下为含 {token} 的模板" }
        judge:
          type: object
          description: |
            ACM 编程题判定定义（bank=acm 必填；ctf 题出现该段一律 422）。
            ACM 题不通过 flag 判定——学生提交 yak 源码，judge worker 用引擎执行
            并对拍测试数据（对齐 ICPC 模型：样例 + 隐藏数据逐组运行、token 忽略
            行尾空白比对、时限/内存限制、AC/WA/TLE/RE 判定）。题目包 zip 中
            测试数据文件放 testdata/ 目录，由包上传管线存入 judge.testdata；
            challenge.json 直传（无 zip）无法携带数据文件，仅适合包路径。
          required: [engine, time_limit_s, testdata]
          properties:
            engine: { type: string, enum: [yak], description: 判题引擎（第一版仅 yaklang yak） }
            time_limit_s:
              type: integer
              minimum: 1
              maximum: 60
              description: 单组测试数据的运行时限（秒；worker 对引擎进程整体计时，超时判 TLE）
            memory_limit_mb:
              type: integer
              minimum: 16
              maximum: 512
              default: 128
              description: 单组测试数据的内存上限（MB；超限判 RE）
            allowed_libs:
              type: array
              description: |
                yak 库白名单（防高危库执行）：配置后学生源码只能引用这些库
                （其余库一律 422 拒绝）；留空/缺省 = 允许全部（全局黑名单除外）。
                值必须是 yaklang 命名空间库名（如 str/codec/io/json/time/os）；
                配置黑名单库（exec/file 等）→ 422。提交与自测运行在受理前做
                静态扫描拦截（标识符级，含 `a := exec` 这类别名引用）。
              items: { type: string }
            testdata:
              type: array
              minItems: 1
              description: 测试数据组（.in/.answer 成对；sample=true 的组学生可见样例）
              items:
                type: object
                required: [name, input, output]
                properties:
                  name: { type: string, description: 组名（包内文件去扩展名；展示用） }
                  input: { type: string, description: 输入数据全文 }
                  output: { type: string, description: 期望输出全文 }
                  sample: { type: boolean, default: false, description: 是否样例组（题面样例；隐藏组 false） }
        env:
          type: object
          description: 容器环境（image/port 要么都填要么都不填）
          properties:
            image: { type: string }
            port: { type: integer }
        hints:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              content: { type: string }
              cost: { type: integer }
        links:
          type: array
          description: 题目外链（配套工具/参考资料），随 challenge.json 上传存储
          items:
            type: object
            required: [name, url]
            properties:
              name: { type: string }
              url: { type: string }
        tutorial_slug: { type: string, description: 关联教程 Room slug（可选） }
    ChallengePackageUpload:
      type: object
      description: |
        实训常用题目包（zip）。必含 challenge.yml；带容器时还必含 Dockerfile 与 docker-compose.yml。
        ACM 编程题（challenge.yml 带 judge 段）包内以 testdata/ 目录携带数据文件：
        testdata/<组名>.in 输入、testdata/<组名>.answer 期望输出（对齐 ICPC .in/.ans
        惯例，期望输出用 .answer 避开构建工具对 .ans 的误处理），组名建议 01/02/03
        序号；题面样例组在 challenge.yml judge.testdata 里按 name 标 sample: true。
        详见 content-package-spec skill。
    ChallengeAttachment:
      type: object
      description: 题目附件元数据（文件落盘附件目录，学生端凭 JWT 下载）
      properties:
        filename: { type: string, description: 规范化文件名（下载 URL 段） }
        size: { type: integer, description: 字节数 }
        created_at: { type: string, description: RFC3339 }
    AdminLabInstance:
      type: object
      description: 管理端容器实例条目（LabInstance + 用户/题目富化）
      properties:
        id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        challenge_id: { type: integer }
        challenge_title: { type: string }
        challenge_slug: { type: string }
        status: { type: string, enum: [creating, running, stopped, destroyed] }
        endpoint: { type: string }
        expire_at: { type: string }
        created_at: { type: string }
    Competition:
      type: object
      description: 竞赛实体（管理端创建/配置；状态由当前时刻与起止时间派生）
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, description: 竞赛说明（Markdown） }
        start_time: { type: string, format: date-time, description: 开赛时间（RFC3339） }
        end_time: { type: string, format: date-time, description: 结束时间（RFC3339）；结束后解除参赛锁定、开放 WP 提交 }
        status: { type: string, enum: [scheduled, running, ended], description: scheduled=未开始 / running=进行中 / ended=已结束 }
        created_at: { type: string }
    CompetitionDetail:
      type: object
      description: 管理端竞赛详情（实体 + 计数统计）
      allOf:
        - $ref: '#/components/schemas/Competition'
        - type: object
          properties:
            stats:
              type: object
              properties:
                teams: { type: integer, description: 战队数 }
                participants: { type: integer, description: 参赛人数 }
                entered: { type: integer, description: 已入场人数 }
                challenges: { type: integer, description: 题目数 }
                instances: { type: integer, description: 竞赛容器数（全部状态） }
                warnings: { type: integer, description: 反作弊警告数 }
                writeups: { type: integer, description: 已提交 WP 人数 }
    CompetitionChallengeItem:
      type: object
      description: 竞赛题目条目（参赛者视角含描述与通关状态）
      properties:
        id: { type: integer, description: challenge_id }
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        difficulty: { type: string, enum: [apprentice, practitioner, expert] }
        score: { type: integer, description: 初始分值（竞赛内动态计分） }
        has_env: { type: boolean, description: 是否定义容器环境 }
        description_md: { type: string, description: 题目描述 Markdown（参赛者视角返回） }
        solved: { type: boolean, description: 当前用户（队内）是否已通关 }
    CompetitionParticipantItem:
      type: object
      description: 参赛人员条目（管理端；含队伍与入场状态）
      properties:
        id: { type: integer, description: participant_id }
        user_id: { type: integer }
        username: { type: string }
        team_id:
          type: integer
          nullable: true
          description: 所属战队（个人参赛为 null）
        team_name:
          type: string
          nullable: true
        invite_code: { type: string, description: 入场邀请码（管理员可重新分发） }
        entered: { type: boolean, description: 是否已入场 }
        entered_at:
          type: string
          nullable: true
        last_ip: { type: string, description: 最近提交来源 IP（反作弊 IP 异常检测基线） }
        created_at: { type: string }
    CheatWarningItem:
      type: object
      description: 反作弊警告（只在管理端展示：原因、人员、战队）
      properties:
        id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        team_id:
          type: integer
          nullable: true
        team_name:
          type: string
          nullable: true
        kind: { type: string, enum: [cross_team_flag, ip_anomaly], description: cross_team_flag=提交其他队伍 flag / ip_anomaly=来源 IP 异常 }
        reason: { type: string, description: 命中说明（含证据要素） }
        created_at: { type: string }
    WriteupItem:
      type: object
      description: WP 提交条目（管理端；单位 = 题目 × 队伍/个人）
      properties:
        id: { type: integer }
        challenge_id: { type: integer }
        challenge_title: { type: string }
        user_id: { type: integer, description: 最近一次提交/修改人（队伍模式为提交队员） }
        username: { type: string }
        team_name:
          type: string
          nullable: true
          description: null = 个人参赛者
        submitted_at: { type: string }
        content: { type: string, description: WP 正文 Markdown }
        zip_name: { type: string, description: 附带 zip 原文件名（未上传为空字符串） }
    MyWriteupItem:
      type: object
      description: 本队/本人某题的 WP（参赛端）
      properties:
        challenge_id: { type: integer }
        content_md: { type: string }
        zip_name: { type: string, description: 已上传 zip 原文件名（未上传为空字符串） }
        updated_at: { type: string }
        updated_by: { type: string, description: 最近一次提交/修改人用户名 }
    TeamLeaderboardEntry:
      type: object
      description: 战队排行榜条目（同分并列同名次）
      properties:
        rank: { type: integer }
        team_id: { type: integer }
        team_name: { type: string }
        score: { type: integer, description: 队内成员得分合计（事件派生） }
        solved_count: { type: integer, description: 队内成员通关题数 }
        members: { type: array, items: { type: string }, description: 成员用户名列表 }
        last_solve_at: { type: string, nullable: true, description: 最近一次通关时间（同分先达者靠前） }
    CompLeaderboardEntry:
      type: object
      description: 竞赛个人排行榜条目（同分并列同名次）
      properties:
        rank: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        team_name:
          type: string
          nullable: true
        score: { type: integer }
        solved_count: { type: integer }
        last_solve_at: { type: string, nullable: true, description: 最近一次通关时间（同分先达者靠前） }
    ParticipantImportRequest:
      type: object
      description: |
        参赛人员与队伍批量导入（JSON）。成员按用户名引用：
        不存在的用户自动创建（随机初始密码，响应中返回供管理员分发）。
      properties:
        teams:
          type: array
          items:
            type: object
            required: [name, members]
            properties:
              name: { type: string, description: 战队名（竞赛内唯一） }
              members: { type: array, items: { type: string }, description: 成员用户名 }
        individuals: { type: array, items: { type: string }, description: 个人参赛者用户名（不编队） }
    ParticipantImportResult:
      type: object
      description: 批量导入结果：新建账号（含初始密码）与全部参赛者邀请码
      properties:
        created_accounts:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              initial_password: { type: string, description: 自动创建账号的随机初始密码（仅本次响应返回） }
        participants:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              team_name: { type: string, nullable: true }
              invite_code: { type: string }
              mail_delivered: { type: boolean, description: 站内邀请邮件是否投递成功 }
    MyCompetitionEntry:
      type: object
      description: 当前用户参赛/锁定状态（前端路由守卫用）
      properties:
        competition:
          allOf:
            - $ref: '#/components/schemas/Competition'
          nullable: true
          description: 已入场的进行中竞赛（null = 未锁定）
        locked: { type: boolean, description: true = 已入场且竞赛未结束，平台其余入口锁定 }
        entered: { type: boolean, description: 是否已入场（该竞赛） }
        team_name:
          type: string
          nullable: true
          description: 所属战队（个人参赛为 null）

  responses:
    ErrorResp:
      description: 统一错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [public]
      security: []
      summary: 健康检查（进程存活探针，无鉴权；compose healthcheck 使用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
  /metrics:
    get:
      tags: [public]
      security: []
      summary: >
        Prometheus 文本格式指标（ops 硬化）：HTTP 请求计数/耗时按路由 pattern 聚合
        （method/route/status 标签）+ 运行时指标（goroutine/内存/uptime）。
        Bearer 令牌与 ACADEMY_METRICS_TOKEN 恒时比对；未配置 token = 端点关闭 404。
        告警由外部 Prometheus + Alertmanager 完成（平台不内置）
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录换取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /auth/sms/code:
    post:
      tags: [auth]
      security: []
      summary: 发送注册验证码
      description: >
        向手机号发送 6 位验证码（5 分钟有效，核销一次性）。
        同手机号 60 秒内仅允许发送一次、10 分钟内最多 3 次。
        手机号已注册时优先于限频返回 422（发码即拒，不发无谓的验证码）。
        第一版为开发投递器：验证码写入服务日志（不接第三方短信通道）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
      responses:
        '200':
          description: OK（已发送；60 秒内重复请求返回此状态并带 retry_after 提示）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  retry_after: { type: integer, description: 限频剩余秒数，0 = 无需等待 }
                  code: { type: string, description: 验证码原文；仅在服务端开启回显模式（ACADEMY_SMS_SHOW_CODE=1，内网/演示部署）时返回，正式部署不回显 }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: 自助注册（手机验证码核销）
      description: >
        凭有效验证码创建账号，角色固定 student（禁止自选）。
        验证码错误/过期/已核销 → 422；用户名或手机号已存在 → 422。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, username, password]
              properties:
                phone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
                code: { type: string, minLength: 6, maxLength: 6 }
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK（注册成功，直接返回登录 token，无需再登录）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出（吊销当前 token）
      description: 按 JWT 的 jti 写入撤销表，令牌在自然过期前立即失效。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /auth/change-password:
    post:
      tags: [auth]
      summary: 修改本人密码
      description: 校验当前密码后更新；同时使该用户全部已签发 token 失效（需重新登录）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /me:
    get:
      tags: [auth]
      summary: 当前用户信息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /me/profile:
    get:
      tags: [auth]
      summary: 账号信息面板（含内置账号 ID、名称、简介、总得分、头像）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/ErrorResp' }
    patch:
      tags: [auth]
      summary: 修改账号信息（描述简介）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: string, description: 描述简介（≤500 字） }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /me/avatar:
    get:
      tags: [auth]
      summary: 下载当前用户头像（未上传返回 404；浏览器 <img> 直连）
      responses:
        '200':
          description: 头像文件（image/png|jpeg|gif|webp）
          content:
            image/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [auth]
      summary: 上传头像（multipart 字段 file；png/jpeg/gif/webp，≤2MB；重复上传覆盖）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar: { type: string, description: 头像 URL }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /me/mails:
    get:
      tags: [auth]
      summary: 站内邮箱（只收不发）：收件列表，分页，新邮件在前
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      unread: { type: integer, description: 全部未读数（角标） }
                      items: { type: array, items: { $ref: '#/components/schemas/MailItem' } }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /me/mails/unread-count:
    get:
      tags: [auth]
      summary: 未读邮件数（头部角标轮询）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /me/mails/{id}/read:
    post:
      tags: [auth]
      summary: 标记邮件已读
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  read: { type: boolean }
        '401': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /topics:
    get:
      tags: [student]
      summary: 主题列表（仅 published）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Topic' } }
        '401': { $ref: '#/components/responses/ErrorResp' }

  /topics/{topicSlug}:
    get:
      tags: [student]
      summary: 主题详情（含 Room 列表）
      parameters:
        - { name: topicSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    put:
      tags: [admin]
      summary: 更新主题元数据（仅管理员）
      parameters:
        - { name: topicSlug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                summary: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /topics/{topicSlug}/rooms/{roomSlug}:
    get:
      tags: [student]
      summary: Room 详情（教程正文 + 内嵌 Lab）
      parameters:
        - { name: topicSlug, in: path, required: true, schema: { type: string } }
        - { name: roomSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/instance:
    post:
      tags: [student]
      summary: 启动/获取本人在该题目的环境实例（幂等；instance flag_mode 时注入唯一 FLAG）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK（已存在则直接返回）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabInstance' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '409':
          description: 已有活跃容器（同时只允许一个，返回当前实例引导关闭）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { $ref: '#/components/schemas/Error' }
                  current: { $ref: '#/components/schemas/AdminLabInstance' }
        '422': { $ref: '#/components/responses/ErrorResp' }
        '501': { $ref: '#/components/responses/ErrorResp' }
    get:
      tags: [student]
      summary: 查询本人在该题目的环境实例状态（无实例返回 null）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LabInstance'
                  - nullable: true
        '404': { $ref: '#/components/responses/ErrorResp' }
    delete:
      tags: [student]
      summary: 销毁本人在该题目的环境实例
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/instance/extend:
    post:
      tags: [student]
      summary: 续期实例 TTL（不重建容器；expire_at = now+1h；每实例最多续期 2 次）
      description: 已续期 2 次后再续期返回 422（治理约束：防止容器被无限占用，
        单容器 TTL 上限 3 小时 = 初始 1h + 续期 2×1h）。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabInstance' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /checkpoints/{token}:
    post:
      tags: [env]
      security: []
      summary: 环境检测点自动判定回调（题目容器内 checker 调用，token 能力鉴权，非 JWT）
      description: >
        实例启动时服务端向容器注入 CHECKPOINT_TOKEN 与 CHECKPOINT_URL 两个环境变量。
        题目内置 checker 检测到目标达成后 POST CHECKPOINT_URL（无需 body）。
        token 命中活跃实例即入队一条自动判定提交（哨兵答案，不出现在提交接口可用的取值里），
        由异步 worker 走与手动提交完全相同的管线判过计分（防重复通关、动态计分、room.completed）。
        语义参考 PortSwigger lab 的服务端通关按钮。
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: 已入队（异步判定，结果经 GET /submissions/{id} 或题目详情 solved 字段体现）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending] }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}:
    get:
      tags: [student]
      summary: 题目详情（描述 markdown + hints + 关联教程）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeDetail' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/judge/samples:
    get:
      tags: [student]
      summary: ACM 编程题样例测试数据（sample=true 的组）
      description: 仅 ACM 编程题（judge 段存在）返回；flag 判定题 404。
        隐藏测试组（sample=false）不出现在响应中。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_limit_s: { type: integer, description: 单组数据时限（秒） }
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        input: { type: string, description: 样例输入全文 }
                        output: { type: string, description: 样例期望输出全文 }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/judge/runs:
    post:
      tags: [student]
      summary: ACM 编程题自测运行（在线执行框）
      description: |
        学生在平台内直接运行 yak 源码自测（在线 IDE / custom invocation 模式）。
        不产生提交记录、不判分、不写事件流——与正式提交（POST /submissions）完全
        隔离。sample 模式喂指定样例组（sample=true）的输入，完成后与期望输出比对
        （matches 字段，与判题同一比对器：token 级空白不敏感）；stdin 模式喂
        自定义输入。异步执行（与判题一致的模型）：创建返回 run id，
        轮询 GET /challenges/{slug}/judge/runs/{id} 取结果。
        限制：source ≤ 128KiB；stdin ≤ 256KiB；stdout 响应截断 64KiB（truncated
        标记）；同一用户同时仅 1 个进行中的 run（422）；判定引擎未配置
        （ACADEMY_YAK_BIN 空）422；完成票据保留 10 分钟后过期（404）。
        库策略与正式提交一致：源码命中黑名单库 / 白名单外库 → 422（受理前拦截）。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, description: yak 源码 }
                sample:
                  type: string
                  description: 样例组名（仅 sample=true 的组）；与 stdin 二选一（都不带 = 422）
                stdin:
                  type: string
                  description: 自定义输入全文；与 sample 二选一
      responses:
        '202':
          description: 已受理（异步执行）
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, description: run id（轮询用） }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/judge/runs/{id}:
    get:
      tags: [student]
      summary: ACM 自测运行结果轮询
      description: |
        轮询自测运行状态（仅创建者可查，他人/过期票据 404）。status=done 时携带
        结果字段：outcome 引擎结论（ok/tle/re）、stdout 运行输出、time_ms 耗时；
        sample 模式另有 matches（输出与样例期望是否一致，custom 模式为 null）。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [pending, running, done] }
                  mode: { type: string, enum: [sample, custom] }
                  sample: { type: string, description: sample 模式时的组名 }
                  outcome: { type: string, enum: [ok, tle, re], description: status=done 时 }
                  stdout: { type: string, description: 运行输出（截断至 64KiB） }
                  stderr: { type: string, description: outcome=re 时的错误输出 }
                  truncated: { type: boolean, description: stdout 是否被截断 }
                  time_ms: { type: integer, description: 引擎运行耗时（毫秒） }
                  matches: { type: boolean, nullable: true, description: sample 模式输出比对结果；custom 模式 null }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges/{slug}/hints/{hintId}/unlock:
    post:
      tags: [student]
      summary: 扣分解锁提示（写 hint.unlocked 事件；已解锁则幂等返回正文）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: hintId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HintUnlockResponse' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422':
          description: 积分不足或其他校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /submissions:
    post:
      tags: [student]
      summary: 提交答案（异步判定，返回 pending）
      description: |-
        flag 判定题（static/regex）提交 flag 文本；ACM 编程题提交 yak 源码全文——
        服务端经引擎对每组测试数据运行比对后判定（async worker），不比对 flag。
        同一 ACM 题在判定出结果前重复提交 422（防并发刷引擎）。
        ACM 题库策略拦截（受理前静态扫描）：源码引用全局黑名单库（exec/file 等）
        或题目 judge.allowed_libs 白名单之外的库 → 422。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionRequest' }
      responses:
        '202':
          description: Accepted（已入队）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /submissions/{id}:
    get:
      tags: [student]
      summary: 查询判定结果
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /challenges:
    get:
      tags: [student]
      summary: 题库题目列表（跨 Topic 全量，含当前用户 solved/has_env；隐藏/未到发布时间的题目已过滤；可按题库 tab 与是否内置过滤）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: bank, in: query, description: 题库 tab（tutorial=内置题集；缺省 = 全部）, schema: { type: string, enum: [tutorial, ctf, acm] } }
        - { name: builtin, in: query, description: 是否内置题集（缺省 = 全部）, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/TrainingItem' } }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /progress:
    get:
      tags: [student]
      summary: 个人进度（事件派生数据）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  xp: { type: integer }
                  completed_rooms: { type: integer }
                  in_progress_rooms: { type: integer }

  /leaderboard:
    get:
      tags: [student]
      summary: 排行榜（事件派生数据）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/LeaderboardEntry' } }

  /badges:
    get:
      tags: [student]
      summary: 徽章列表（含当前用户获得状态；徽章是积分/进度派生数据的计算型读模型，不落库）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Badge' }

  /content/packages:
    get:
      tags: [admin]
      summary: 内容包列表（分页）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ContentPackage' } }
        '401': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 上传内容包（进入五步管线）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  format: binary
                  description: 内容包 zip（结构见 content-package-spec skill）
      responses:
        '201':
          description: Created（draft 状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}:
    get:
      tags: [admin]
      summary: 内容包状态与版本
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '404': { $ref: '#/components/responses/ErrorResp' }
    delete:
      tags: [admin]
      summary: 删除内容包及其教程内容（不可恢复）
      description: |
        删除包记录与全部版本，并移除该包历代版本 Payload 写入过的
        Topic/Room（上传时的 slug 归属校验保证不会误删他包内容）。
        级联清理：指向被删 Room 的题目 tutorial_slug 置空、被删 Room 的
        Progress 行删除（deriver 对不存在 Room 的 room.completed 事件跳过，
        重放不复活）。Event 表 append-only 不动，提交/解锁历史保留。
        draft 包（从未发布）删除仅移除包记录与版本。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deleted, topics, rooms]
                properties:
                  deleted: { type: boolean, description: 包是否已删除 }
                  topics: { type: integer, description: 移除的 Topic 数 }
                  rooms: { type: integer, description: 移除的 Room 数 }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}/publish:
    post:
      tags: [admin]
      summary: 发布内容包（draft → published）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '403': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}/versions:
    get:
      tags: [admin]
      summary: 内容包版本列表（含各版本状态）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentVersion' }
        '404': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}/archive:
    post:
      tags: [admin]
      summary: 归档内容包（published → archived，包级冻结，内容表不动）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /content/packages/{id}/rollback:
    post:
      tags: [admin]
      summary: 回滚内容包到指定历史版本（目标版本 Payload 重写内容表）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id]
              properties:
                version_id: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPackage' }
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges:
    get:
      tags: [admin]
      summary: 题目全量列表（管理端题目管理表格，分页；支持搜索与筛选）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - name: q
          in: query
          description: 关键字搜索（slug / 标题 / 分类，前缀 LIKE，不区分大小写）
          schema: { type: string }
        - name: bank
          in: query
          description: 题库 tab 过滤（ctf / acm / tutorial）
          schema: { type: string, enum: [ctf, acm, tutorial] }
        - name: category
          in: query
          description: 分类 slug 精确匹配
          schema: { type: string }
        - name: difficulty
          in: query
          description: 难度过滤
          schema: { type: string, enum: [apprentice, practitioner, expert] }
        - name: builtin
          in: query
          description: 来源过滤（true 仅内置 / false 仅自建；缺省 = 全部）
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/TrainingItem'
                            - type: object
                              properties:
                                description_md: { type: string }
        '403': { $ref: '#/components/responses/ErrorResp' }
    post:
      tags: [admin]
      summary: 上传题目定义 JSON（单个对象或对象数组，upsert 生效；无容器题目可用）
      description: 内置训练集题目（is_builtin）以该接口重传一律 422——内置题集只能经
        「一键导入」整体更新（目录是唯一事实源），不提供单题编辑出路。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ChallengeJSON'
                - type: array
                  items: { $ref: '#/components/schemas/ChallengeJSON' }
      responses:
        '200':
          description: OK（返回导入数量与 slugs）
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  slugs: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/package:
    post:
      tags: [admin]
      summary: 上传实训常用题目包 zip（必含 challenge.yml；有容器时必含 Dockerfile + docker-compose.yml）
      description: |-
        ACM 编程题：challenge.yml 带 judge 段，包内 testdata/&lt;组名&gt;.in/.answer
        成对提供测试数据（详见 ChallengePackageUpload schema）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  format: binary
                  description: 题目包 zip
      responses:
        '200':
          description: OK（upsert 单题）
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  slugs: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/builtin:
    post:
      tags: [admin]
      summary: 一键导入内置训练集（教程 + 题目；重复调用 = 更新）
      description: |-
        导入随后端二进制分发的官方内置训练集（基于 yaklang vulinbox 靶场引擎）。
        行为：先导入配套教程（Topic/Room，与题目 1:1——每题 tutorial_slug 指向
        配套教程 Room；直接 upsert，无 draft/publish，写入时标记 is_builtin=true
        ——内置教程不可经内容包/删除入口改动），再在 Docker 可用时构建
        vulinbox 基础镜像（失败则整体 422 不入库，与题目包"构建失败不入库"
        语义一致），最后逐题 upsert（slug 重复 = 更新）；未配置 Docker 驱动
        （noop）时跳过镜像构建仅导入定义，image_built=false。
        导入完成后同步清理：库中 is_builtin=true 但已不在当前目录里的
        题目/Room/Topic（历史版本导入的残留）按删除级联清理（销毁运行中
        实例、删附件/flags/hints；提交事件 append-only 保留），返回 removed
        计数。目录是内置内容的唯一事实源。
      responses:
        '200':
          description: OK（返回训练集版本、新增/更新/清理计数、教程计数与镜像构建状态）
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, description: 内置训练集版本 }
                  created: { type: integer, description: 本次新增题数 }
                  updated: { type: integer, description: 本次更新题数 }
                  removed: { type: integer, description: 本次清理的目录外内置残留题数（历史版本导入遗留） }
                  topics: { type: integer, description: 本次导入（upsert）的教程 Topic 数 }
                  rooms: { type: integer, description: 本次导入（upsert）的教程 Room 数（与题 1:1） }
                  slugs: { type: array, items: { type: string } }
                  image_built: { type: boolean, description: 本次是否构建了基础镜像 }
        '422': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/builtin/image:
    get:
      tags: [admin]
      summary: vulinbox 基础镜像状态（驱动 / 镜像是否就绪 / 可否构建）
      description: |-
        管理端镜像状态卡数据源。driver 为服务端装配的实例驱动
        （auto 探测或显式配置：docker = 可构建/可启动容器，noop = 环境接口 501）；
        image_present 探测本地 docker 镜像是否存在（noop 驱动恒为 false）。
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [driver, image_tag, image_present, can_build]
              properties:
                driver: { type: string, enum: [docker, noop], description: 实例驱动（builder 类型推断） }
                image_tag: { type: string, description: 内置训练集基础镜像 tag（manifest） }
                image_present: { type: boolean, description: 本地镜像已构建 }
                can_build: { type: boolean, description: 当前装配是否具备镜像构建能力（Docker 驱动） }
    post:
      tags: [admin]
      summary: 构建 vulinbox 基础镜像（docker build 内从官方 OSS 下载二进制）
      description: |-
        仅构建镜像、不写任何内容表（与一键导入的镜像构建步骤同一实现）。
        构建上下文随二进制分发（Dockerfile + NOTICE），构建时从
        oss-qn.yaklang.com 下载官方 vulinbox 二进制（约 165MB，sha256 锁定，
        上游更新会导致校验失败 422——防靶机行为漂移，属刻意行为）。
        noop 驱动（无 Docker）返回 422。同步接口，耗时约 1-3 分钟。
      responses:
        '200':
          description: OK（构建成功）
          content:
            application/json:
              schema:
                type: object
                required: [image_tag, built]
                properties:
                  image_tag: { type: string, description: 本次构建的镜像 tag }
                  built: { type: boolean, description: 恒为 true }
        '422': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/engine/yak:
    get:
      tags: [admin]
      summary: yak 判题引擎状态（ACM 编程题 tab 引擎状态卡数据源）
      description: |-
        configured = 判题/自测运行可用（引擎已装配：启动时 ACADEMY_YAK_BIN
        或数据目录探测，或此前经下载端点装配）。path 为当前引擎路径
        （未装配时为下载目标路径，供下载前展示）。version 为已知版本
        （下载完成后解析；未知为空串）。download 为最近一次下载任务状态
        （进程内存，重启回到 idle）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [configured, path, version, download]
                properties:
                  configured: { type: boolean, description: 引擎已装配（code 判定与自测运行可用） }
                  path: { type: string, description: 当前引擎路径；未装配时为下载目标路径 }
                  version: { type: string, description: 已知引擎版本（下载完成时解析；未知为空） }
                  download:
                    type: object
                    required: [state, received, total]
                    properties:
                      state: { type: string, enum: [idle, running, done, failed], description: 下载任务状态 }
                      received: { type: integer, description: 已接收字节数 }
                      total: { type: integer, description: 总字节数（Content-Length；未知为 -1） }
                      error: { type: string, description: 失败原因（state=failed 时） }

  /admin/challenges/engine/yak/download:
    post:
      tags: [admin]
      summary: 从官方 OSS 下载 yak 判题引擎并即时装配
      description: |-
        异步任务：按服务端运行时 GOOS/GOARCH 从 yaklang 官方 OSS
        （oss-qn.yaklang.com/yak/latest/）下载引擎二进制（约 220MB），
        流式写入数据目录（.part 临时文件 + 原子改名，0755），完成后即时
        装配判题引擎（无需重启；路径探测在重启后仍生效）。响应 202 返回
        当前状态，进度经 GET /admin/challenges/engine/yak 轮询
        （state=running 时 received/total 递增）。已在下载中返回 422。
      responses:
        '202':
          description: Accepted（任务已受理）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YakEngineStatus'
        '422': { $ref: '#/components/responses/ErrorResp' }
        '500': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/builtin/tutorials:
    get:
      tags: [admin]
      summary: 内置训练集教程目录与导入状态（教程管理页「内置训练集」区块数据源）
      description: |-
        返回随二进制嵌入的内置训练集教程目录（topic → rooms，slug/标题/难度，
        帐面清单由 embed 资产解析，不依赖已导入）与每篇 imported 标志
        （按内容表 slug 存在性探测；is_builtin 教程行只经一键导入写入）。
        imported_topics/imported_rooms 为已导入计数，全量导入后与目录总数一致。
        imported=false 即教程未导入（或曾被删——内置教程不可删，仅可能未导入）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, topics, imported_topics, imported_rooms]
                properties:
                  version: { type: string, description: 内置训练集版本（manifest） }
                  topics:
                    type: array
                    items:
                      type: object
                      required: [slug, title, rooms]
                      properties:
                        slug: { type: string }
                        title: { type: string }
                        rooms:
                          type: array
                          items:
                            type: object
                            required: [slug, title, difficulty, imported]
                            properties:
                              slug: { type: string }
                              title: { type: string }
                              difficulty: { type: string, enum: [apprentice, practitioner, expert] }
                              imported: { type: boolean, description: 该 Room 是否已导入（内容表 slug 存在） }
                  imported_topics: { type: integer, description: 已导入 Topic 数 }
                  imported_rooms: { type: integer, description: 已导入 Room 数 }

  /admin/challenges/{slug}:
    get:
      tags: [admin]
      summary: 读取题目完整定义（管理端编辑回填用）
      description: |-
        返回与上传 JSON（POST /admin/challenges）同构的单题完整定义：
        含 flag 值、flag_mode、判定类型、容器环境、提示与外链。
        这是唯一暴露 flag 值的读接口（仅 admin；flag 由管理员上传时提供）。
        challenge.flag = flags[0] 供单 flag 表单回填；多 flag（题目包 zip 能力）
        时 flags 数组完整返回，前端保存需提示「只保留表单中这一个」。
        bank=tutorial（内置题集）原样返回，重传时省略 bank 即保留。
        ACM 编程题额外返回 judge 段（数据组仅 name/sample 标记，内容不回填）；
        编辑保存时 judge 段不带数据组即保留库内测试数据（元数据维护语义）。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK（与上传 JSON 同构的完整定义）
          content:
            application/json:
              schema:
                type: object
                required: [slug, title, category, bank, difficulty, description_md, score, flag_mode, challenge, hints, links, tutorial_slug, flags]
                properties:
                  slug: { type: string }
                  title: { type: string }
                  category: { type: string }
                  bank: { type: string, enum: [tutorial, ctf, acm] }
                  difficulty: { type: string, enum: [apprentice, practitioner, expert] }
                  description_md: { type: string }
                  score: { type: integer }
                  flag_mode: { type: string, enum: [shared, instance] }
                  challenge:
                    type: object
                    properties:
                      type: { type: string, enum: [static, regex] }
                      flag: { type: string, description: 'flags[0]，表单回填用' }
                  judge:
                    type: object
                    nullable: true
                    description: ACM 编程题判定段（flag 判定题为 null）
                    properties:
                      engine: { type: string, enum: [yak] }
                      time_limit_s: { type: integer }
                      memory_limit_mb: { type: integer }
                      allowed_libs:
                        type: array
                        nullable: true
                        description: yak 库白名单（null = 未配置，允许全部非黑名单库；编辑回填/保存）
                        items: { type: string }
                      testdata:
                        type: array
                        description: 数据组引用（name + sample 标记；内容不回填）
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            sample: { type: boolean }
                  env:
                    type: object
                    nullable: true
                    description: 无容器环境时为 null
                    properties:
                      image: { type: string }
                      port: { type: integer }
                  hints:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        content: { type: string }
                        cost: { type: integer }
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        url: { type: string }
                  tutorial_slug: { type: string }
                  flags:
                    type: array
                    description: 完整 flag 值列表（题目包 zip 可多 flag）
                    items: { type: string }
        '404': { $ref: '#/components/responses/ErrorResp' }
    delete:
      tags: [admin]
      summary: 删除题目（级联删除 flags/hints/attachments；存在通关记录时拒绝）
      description: |-
        题目存在任一用户通关记录（submission 事件历史）时返回 409——
        事件溯源下提交历史 append-only 不可删，删除题目会制造悬挂积分。
        内置训练集题目（is_builtin）返回 422：内置题集只能经「一键导入」
        随目录整体更新/清理，不提供单题删除。
        无通关记录时：销毁该题目全部运行中实例，级联删除 flags/hints/attachments/lab_instances 行
        并清理附件目录。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422':
          description: 内置训练集题目，不可删除（只能经一键导入随目录清理）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 题目存在通关记录，拒绝删除（事件历史不可删）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/challenges/{slug}/visibility:
    patch:
      tags: [admin]
      summary: 更新题目可见性 / 定时发布
      description: |-
        is_visible=false 或 release_at 在未来时，学生端训练场列表、题目详情、
        实例启动、答案提交、提示解锁对该题返回 404（隐藏语义同不存在）。
        已有通关记录不受影响（事件历史 append-only 不动），题目重新可见后恢复开放。
        内置训练集题目（is_builtin）返回 422：内置题集的可视性由一键导入管理，
        不提供单题开关。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                is_visible: { type: boolean }
                release_at:
                  type: string
                  nullable: true
                  description: RFC3339；null = 清除定时（立即语义）
      responses:
        '200':
          description: OK（返回更新后的题目可见性状态）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingItem'
        '403': { $ref: '#/components/responses/ErrorResp' }
        '404': { $ref: '#/components/responses/ErrorResp' }
        '422': { $ref: '#/components/responses/ErrorResp' }

  /admin/challenges/{slug}/attachments:
    get:
      tags: [admin]
      summary: 题目附件列表（管理端）
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
