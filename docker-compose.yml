# yak-academy 平台部署（单机）。
#
# 部署约定（docs/architecture.md §9）：以 Docker Compose 容器化部署于 Linux 宿主
# （amd64）为唯一受支持形态；Docker Desktop（Win/Mac）仅供本地体验。
#
# 架构边界（docs/architecture.md 演进路线：第一版单机边界）：
# - 后端通过挂载宿主 /var/run/docker.sock + 容器内 docker CLI 管理题目容器；
#   题目容器创建在宿主 daemon 上，与本服务是兄弟容器（非 in-docker 嵌套）。
# - 题目容器端口固定发布到宿主 127.0.0.1（DockerDriver.Create），
#   因此学员必须在本机访问题目 endpoint——多用户远程访问属 Phase 4 范围。
# - CHECKPOINT_URL 由 ACADEMY_PUBLIC_URL 拼出：题目容器需回达后端 8080 端口。
#   DockerDriver.Create 以 --add-host host-gateway 注入 host.docker.internal 解析，
#   Linux 与 Docker Desktop 默认值均开箱即用；仅当宿主防火墙拦截容器→宿主
#   流量（如 firewalld 默认拦 docker0）时改为宿主 LAN IP。
#
# 可通过 .env / 环境变量覆盖：ACADEMY_JWT_SECRET、ACADEMY_ADMIN_PASSWORD 必改，
# ACADEMY_PUBLIC_URL 按宿主网络环境调整。
services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: yak-academy/backend:latest
    ports:
      - "8080:8080" # 题目容器检测点回调经此端口回达（ACADEMY_PUBLIC_URL 指向它）
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # 题目容器治理（兄弟容器模式）
      - ./data:/data # SQLite 数据库与上传内容持久化
    environment:
      ACADEMY_ENV_DRIVER: docker
      ACADEMY_JWT_SECRET: ${ACADEMY_JWT_SECRET:?请在 .env 或环境变量中设置 ACADEMY_JWT_SECRET}
      ACADEMY_ADMIN_USERNAME: ${ACADEMY_ADMIN_USERNAME:-admin}
      ACADEMY_ADMIN_PASSWORD: ${ACADEMY_ADMIN_PASSWORD:?请在 .env 或环境变量中设置 ACADEMY_ADMIN_PASSWORD}
      ACADEMY_PUBLIC_URL: ${ACADEMY_PUBLIC_URL:-http://host.docker.internal:8080}
      ACADEMY_ATTACHMENTS_DIR: /data/attachments # 题目附件与 SQLite 一起随 ./data 卷持久化
      ACADEMY_AVATARS_DIR: /data/avatars # 用户头像（容器重建不丢）
      ACADEMY_WRITEUPS_DIR: /data/writeups # 竞赛 WP zip 附件（容器重建不丢）
      ACADEMY_INSTANCE_MEMORY: ${ACADEMY_INSTANCE_MEMORY:-512m} # 题目容器资源限额（docker --memory）
      ACADEMY_INSTANCE_CPUS: ${ACADEMY_INSTANCE_CPUS:-0.5} # 题目容器 CPU 限额（docker --cpus）
    restart: unless-stopped
    healthcheck: # GET /health 存活探针（alpine busybox wget）
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    image: yak-academy/frontend:latest
    depends_on:
      backend:
        condition: service_healthy # 后端健康后前端才启动（反代不再打到未就绪进程）
    ports:
      - "${ACADEMY_WEB_PORT:-8081}:80"
    restart: unless-stopped
