# yak-academy 题目包（实训常用 challenge.yml 约定）。
# 场景对标 Yaklang Vulinbox xss/echo（默认端口 8787）。
slug: vulinbox-xss-reflected
name: Vulinbox 反射型 XSS
category: xss
difficulty: apprentice
description: |
  参考 Yaklang Vulinbox 靶场的反射型 XSS 场景（`/xss/echo?name=`）。

  启动容器后访问题目 endpoint，向 `name` 参数注入脚本载荷，
  从响应页面中取出 flag。本样例使用 `flag_mode: instance`：
  平台为每个实例生成唯一 FLAG，经环境变量注入容器；销毁后需重新启动再交 flag。
value: 100
type: static
flag_mode: instance
flags:
  - "flag{lab-{token}}"
# image: . 表示由同目录 Dockerfile 构建；上传时 docker build，落库为 yak-academy/<slug>:latest
image: .
port: 8787
protocol: http
hints:
  - title: 参数入口
    content: 关注 /xss/echo?name= 这一类反射点
    cost: 10
  - title: 载荷
    content: 试试经典脚本标签注入，再查看响应源码
    cost: 20
