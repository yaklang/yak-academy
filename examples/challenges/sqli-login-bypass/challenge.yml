# 同目录 challenge.json 的 zip 包形态（image: . 上传时由平台 docker build，
# 落库为 yak-academy/sqli-login-bypass:latest —— 与 challenge.json 引用的 tag 一致）。
slug: sqli-login-bypass
name: SQL 注入登录绕过
category: sql-injection
difficulty: apprentice
description: |
  某站点的登录接口直接把用户名拼进 SQL 语句，没有做任何过滤。

  启动容器后访问题目 endpoint（/login），用 SQL 注入绕过登录校验。
  当后端确认「admin 身份登录成功」，题目自动判定通关——无需手动提交 flag。
value: 100
type: static
flag_mode: instance
flags:
  - "flag{sqli-{token}}"
image: .
port: 8080
hints:
  - title: 参数入口
    content: 登录表单的 username 字段直接拼接进 SQL，试试单引号闭合。
    cost: 10
  - title: 万能密码
    content: admin' or '1'='1 加 -- 注释掉后半段密码校验。
    cost: 20