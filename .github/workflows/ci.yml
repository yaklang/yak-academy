# yak-academy CI：后端 Go（vet + test）与前端 Node（typecheck + build）、
# E2E（Playwright，复用 runner 预装 Chrome）、契约解析、Docker 门控集成测试。
# 契约先行（api-contract skill）：openapi.yaml 变更时顺带校验 YAML 可解析。
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -race ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check + build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # 免下载浏览器：ubuntu runner 预装 Google Chrome，E2E_CHANNEL=chrome
      # 直接驱动系统 Chrome（README「环境搭建与镜像加速」说明本地同策略）。
      - name: Run E2E
        run: npm run e2e
        env:
          E2E_CHANNEL: chrome

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend-docker:
    name: Backend Docker integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # ACADEMY_TEST_DOCKER 门控集（repo 约定：无 Docker 时 t.Skip）
      - name: Docker integration tests
        run: go test ./internal/service/ -run Docker -count=1 -v
        env:
          ACADEMY_TEST_DOCKER: '1'

  contract:
    name: API contract (openapi.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse openapi.yaml
        run: python3 -c "import yaml,sys; yaml.safe_load(open('docs/openapi.yaml', encoding='utf-8')); print('openapi.yaml parsed ok')"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'